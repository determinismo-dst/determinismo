# A Compose project of 20 services (src/compose.zig, schema.nodes_max; Vitess's Antithesis
# project has 20): nineteen servers, each answering its own name on port 7000, and a client that
# waits for every one before the setup is complete. Its test command asks each again. Run with:
#   determinismo explore ... --compose tests/antithesis-compat/services/compose.yaml --scenario services
services:
  s01:
    build: ./node
    command: ["/usr/local/bin/server", "s01"]
  s02:
    build: ./node
    command: ["/usr/local/bin/server", "s02"]
