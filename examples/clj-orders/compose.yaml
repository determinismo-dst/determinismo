# SPDX-License-Identifier: MIT
# An orders service in Clojure on Kafka and Postgres (README.md): a broker, a database, and the
# service's JVM with an nREPL, where the service is written.
services:
  kafka:
    image: docker.io/apache/kafka:4.0.0
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_NUM_PARTITIONS: "3"
      KAFKA_HEAP_OPTS: -Xmx512m -Xms512m
    expose: ["9092"]
  postgres:
    image: docker.io/library/postgres:17
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    expose: ["5432"]
  app:
    build:
      context: ../..
      dockerfile: examples/clj-orders/Dockerfile
    depends_on: [kafka, postgres]
    expose: ["7888"]
