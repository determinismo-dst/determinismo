<!doctype html>
<!-- SPDX-License-Identifier: MIT -->
<!-- determinismo's web UI, served by `determinismo serve` at /. One page, no build step, no
     dependencies: it reads the HTTP API (src/serve.zig) and updates live while runs go. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>determinismo</title>
<style>
:root {
  /* The analysis pages' paper (ai-analysis/index.html): ink on yellow, Schola text, slab heads. */
  --bg: #fdf6d8; --panel: #fffbe9; --panel-2: #f6ecc6; --line: #ddd3ab; --text: #1d1b16;
  --muted: #6b6455; --accent: #1a4f8b; --pass: #2e7d32; --fail: #b3261e; --warn: #a15c00;
  --info: #1a4f8b; --code: #f3e9c2; --here: #f1dfa0; --ink: #1d1b16;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --serif: "TeX Gyre Schola", "Century Schoolbook", Georgia, serif;
  --slab: "Roboto Slab", "TeX Gyre Schola", Georgia, serif;
  color-scheme: light;
}
@font-face { font-family: "TeX Gyre Schola"; src: url("/fonts/texgyreschola-regular.otf") format("opentype"); font-weight: normal; font-style: normal; }
@font-face { font-family: "TeX Gyre Schola"; src: url("/fonts/texgyreschola-bold.otf") format("opentype"); font-weight: bold; font-style: normal; }
@font-face { font-family: "TeX Gyre Schola"; src: url("/fonts/texgyreschola-italic.otf") format("opentype"); font-weight: normal; font-style: italic; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, sans-serif; }
a { color: var(--accent); cursor: pointer; text-decoration: none; }
button, input, select, textarea {
  font: inherit; color: var(--text); background: var(--panel-2); border: 1px solid var(--line);
  border-radius: 6px; padding: 6px 10px;
}
button { cursor: pointer; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
input:focus, select:focus, textarea:focus { outline: 1px solid var(--accent); }
.layout { display: grid; grid-template-columns: 260px 1fr; min-height: 100vh; }
aside { background: var(--panel); border-right: 1px solid var(--line); padding: 16px; }
main { padding: 20px 28px; min-width: 0; }
h1 { font-size: 18px; margin: 0 0 14px; letter-spacing: .3px; }
h1 span { color: var(--accent); }
h2 { font-size: 20px; margin: 0; }
.runs { list-style: none; padding: 0; margin: 12px 0 0; }
.runs li { padding: 8px 10px; border-radius: 6px; cursor: pointer; display: flex; justify-content: space-between; }
.runs li:hover, .runs li.selected { background: var(--panel-2); }
.badge { font-size: 11px; padding: 2px 8px; border-radius: 10px; border: 1px solid; white-space: nowrap; }
.badge.pass { color: var(--pass); border-color: var(--pass); }
.badge.fail { color: var(--fail); border-color: var(--fail); }
.badge.running { color: var(--info); border-color: var(--info); }
.badge.error { color: var(--warn); border-color: var(--warn); }
.badge.stopped { color: var(--muted); border-color: var(--muted); }
.loading { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--line); border-top-color: var(--muted);
           border-radius: 50%; animation: loading-spin 0.8s linear infinite; vertical-align: middle; }
@keyframes loading-spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .loading { animation-duration: 2.4s; } }
section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; margin: 14px 0; }
section > header { display: flex; align-items: baseline; gap: 12px; padding: 12px 16px; cursor: pointer; }
section > header h3 { margin: 0; font-size: 17px; color: var(--text); }
section > header .summary { color: var(--muted); font-size: 13px; }
section > .body { padding: 4px 16px 16px; }
section.closed > .body { display: none; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; font-size: 13px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-family: var(--mono); word-break: break-all; }
.progress { height: 6px; background: var(--panel-2); border-radius: 3px; overflow: hidden; margin-top: 10px; }
.progress div { height: 100%; background: var(--accent); transition: width .4s; }
.tabs { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.tabs button { border: 0; border-radius: 0; background: transparent; padding: 4px 12px; }
.tabs button.on { background: var(--panel-2); }
.group-title { margin: 14px 0 4px; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .6px; }
.causality-legend { margin: 4px 0; font-size: 12px; }
.causality-options { margin: 8px 0 2px; font-size: 12px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.causality-options input { font-size: 12px; padding: 2px 4px; margin-left: 4px; }
.causality-legend span { margin-left: 10px; }
.causality-jumps { margin: 6px 0; font-size: 13px; }
.causality-jumps > div { padding: 3px 0; }
.property { border-top: 1px solid var(--line); }
.property > .row { display: flex; align-items: center; gap: 10px; padding: 7px 4px; cursor: pointer; }
.property > .row .name { flex: 1; }
.property > .row .counts { color: var(--muted); font-size: 12px; font-family: var(--mono); }
.history { display: inline-flex; gap: 2px; align-items: center; margin-right: 8px; }
.history .tick { display: inline-block; width: 6px; height: 14px; border-radius: 2px; }
.property > .row a.mark { text-decoration: none; }
.property > .row .mark { background: none; border: none; color: var(--muted); cursor: pointer; padding: 0; font-size: 14px; opacity: .45;
  display: inline-grid; place-items: center; min-width: 24px; min-height: 24px; }
.property > .row .mark:focus-visible { opacity: 1; }
.property > .row .name a { color: inherit; }
.property > .row .name a:hover, .property > .row .name a:focus-visible { text-decoration: underline; }
.property > .row .mark:hover, .property > .row .mark.on { opacity: 1; }
.property > .row .mark.on[data-mark="favorite"] { color: #b8860b; }
.examples { margin: 0 0 10px 28px; overflow-x: auto; }
td, .counts, .stat .value { font-variant-numeric: tabular-nums; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th { text-align: left; color: var(--muted); font-weight: 500; padding: 4px 8px; border-bottom: 1px solid var(--line); }
td { padding: 4px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr.clickable { cursor: pointer; }
tr.clickable:hover { background: var(--panel-2); }
.mono { font-family: var(--mono); font-size: 12.5px; }
.stack { white-space: normal; }
.stack ol { margin: 2px 0 4px; padding-left: 26px; }
.stack li { white-space: pre-wrap; word-break: break-word; }
.cause { white-space: pre-wrap; word-break: break-word; font-size: 11.5px; max-width: 70ch; max-height: 6.5em; overflow: hidden; color: var(--muted, inherit); }
.fail-text { color: var(--fail); }
.pass-text { color: var(--pass); }
.muted { color: var(--muted); }
.search-form { display: grid; grid-template-columns: 1fr; gap: 8px; }
.search-form .temporal { display: grid; grid-template-columns: 180px 1fr 110px; gap: 8px; }
.search-form .actions { display: flex; gap: 8px; align-items: center; }
.logs { max-height: 560px; overflow: auto; border: 1px solid var(--line); border-radius: 6px; }
.logs table td { font-family: var(--mono); font-size: 12px; white-space: pre-wrap; word-break: break-word; }
.logs table td:first-child, .logs table td:nth-child(2) { white-space: nowrap; }
.logs tr.here { background: var(--here); }
.kind { font-size: 11px; padding: 1px 6px; border-radius: 4px; background: var(--panel-2); color: var(--muted); }
.kind.fault { color: var(--warn); }
.kind.assert-fail { color: var(--fail); }
.kind.assert { color: var(--pass); }
.kind.output { color: var(--info); }
.kind.command { color: var(--accent); }
.map { width: 100%; overflow-x: auto; }
.map svg { display: block; }
.legend { display: flex; gap: 16px; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: middle; }
dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 10px; width: 520px; }
dialog::backdrop { background: rgba(30,25,15,.35); }
dialog form { display: grid; gap: 10px; }
dialog label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
/* Inputs in a row of columns shrink with them: their own width would widen the dialog. */
dialog label, dialog input, dialog select { min-width: 0; }
pre.output { background: var(--code); border: 1px solid var(--line); border-radius: 6px; padding: 10px; max-height: 360px; overflow: auto; white-space: pre-wrap; font-size: 12px; }
.empty { color: var(--muted); padding: 30px; text-align: center; }
.view-tabs { margin: 14px 0 0; }
.cell { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; margin: 10px 0; }
.cell textarea { width: 100%; border: 0; border-radius: 8px 8px 0 0; background: var(--code); font-family: var(--mono);
  font-size: 12.5px; resize: vertical; min-height: 44px; padding: 10px; }
.cell .out { padding: 8px 12px; font-size: 13px; }
.cell .out:empty { display: none; }
.cell .out pre { margin: 4px 0; white-space: pre-wrap; font-family: var(--mono); font-size: 12px; }
.cell .out .error { color: var(--fail); white-space: pre-wrap; font-family: var(--mono); font-size: 12px; }
.cell .tools { display: flex; gap: 6px; justify-content: flex-end; padding: 0 8px 8px; }
.cell .tools button { padding: 2px 8px; font-size: 12px; }
/* Presentation (Antithesis's): the outputs alone, for a report. */
#notebook.presenting .cell textarea, #notebook.presenting .cell .tools { display: none; }
.notebook-bar { display: flex; gap: 8px; align-items: center; margin-top: 12px; }
.action { display: flex; align-items: center; gap: 10px; margin: 6px 0; }
.md h1, .md h2, .md h3 { margin: 6px 0; }
.md code { font-family: var(--mono); background: var(--panel-2); padding: 0 4px; border-radius: 4px; }
.brand { display: flex; align-items: center; gap: 10px; margin: 0 0 16px; font-size: 18px; font-weight: 600; }
.runs li .label { display: grid; }
.runs li .label small { color: var(--muted); font-size: 12px; }
.stats { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; margin-top: 16px; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; }
.stat .title { color: var(--muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: .6px; }
.stat .value { font-size: 28px; font-weight: 600; margin: 2px 0; font-variant-numeric: tabular-nums; }
.stat .note { color: var(--muted); font-size: 12px; }
.charts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
.chart { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; min-width: 0; }
.chart .head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
.chart .head h3 { margin: 0; font-size: 15px; color: var(--text); }
.chart .head span { color: var(--muted); font-size: 12px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 6px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.legend b { color: var(--text); font-weight: 500; }
.bars .bar { display: grid; grid-template-columns: minmax(0, 1fr) 40% 44px; gap: 10px; align-items: center; padding: 4px 0; font-size: 12.5px; cursor: pointer; }
.bars .bar .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bars .bar .track { height: 10px; border-radius: 5px; background: var(--panel-2); overflow: hidden; }
.bars .bar .fill { height: 100%; border-radius: 5px; background: var(--fail); }
.bars .bar .count { text-align: right; font-variant-numeric: tabular-nums; }
.tree svg .timeline:hover path, .tree svg .timeline:hover line { stroke-opacity: 1; stroke-width: 2.2; }
.empty svg { display: block; margin: 40px auto 18px; }
.tip { position: fixed; z-index: 50; pointer-events: none; max-width: 420px; background: var(--panel); color: var(--text);
  border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 12.5px; line-height: 1.45;
  box-shadow: 0 10px 30px rgba(40,30,10,.16); opacity: 0; transform: translateY(4px); transition: opacity .08s, transform .08s; }
.tip.on { opacity: 1; transform: none; }
.tip .t-title { font-weight: 600; font-size: 13px; display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.tip .t-dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.tip .t-path { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin: 4px 0; font-family: var(--mono); font-size: 11.5px; }
.tip .t-chip { background: var(--panel-2); border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; }
.tip .t-kv { display: grid; grid-template-columns: max-content 1fr; gap: 1px 10px; margin: 4px 0; }
.tip .t-kv dt { color: var(--muted); } .tip .t-kv dd { margin: 0; font-family: var(--mono); font-size: 11.5px; word-break: break-word; }
.tip .t-why { margin-top: 6px; padding: 6px 8px; border-left: 2px solid var(--accent); background: rgba(26,79,139,.07); border-radius: 0 6px 6px 0; }
.tip .t-why b { color: var(--accent); font-weight: 600; }
.tip .t-foot { margin-top: 6px; color: var(--muted); font-size: 11px; }
.tip .t-fail { color: var(--fail); }
@media (max-width: 1100px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } .charts { grid-template-columns: 1fr; } }
/* The Report design: the run as a document, like the analysis pages. A masthead with the
   latest runs instead of a sidebar, the report in one column (numbered chapters, figures between
   rules, booktabs tables), the tools (Logs explorer, Output, Notebook) full width. */
body { font: 16px/1.45 var(--serif); }
/* minmax: a long path or a wide chart never widens the page past the screen. */
.layout { grid-template-columns: minmax(0, 1fr); }
#main > .muted { overflow-wrap: anywhere; }
aside { background: transparent; border-right: 0; border-bottom: 1px solid var(--line);
  padding: 16px max(24px, calc((100% - 1060px) / 2)) 10px;
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px 22px; align-items: center; min-width: 0; }
aside .brand { margin: 0; font: 600 20px var(--slab); letter-spacing: -.2px; color: var(--ink); }
aside #new-run { order: 3; background: none; border: 0; color: var(--accent); padding: 0; font: italic 16px var(--serif); }
aside #new-run:hover { text-decoration: underline; }
aside #runs-filter { justify-self: end; width: 100%; max-width: 360px; background: transparent; border: 0;
  border-bottom: 1px solid var(--line); border-radius: 0; font: italic 15px var(--serif); padding: 4px 2px; }
aside #runs-filter:focus { outline: 0; border-bottom-color: var(--accent); }
.runs { grid-column: 1 / -1; order: 4; display: flex; overflow-x: auto; min-width: 0; margin: 2px 0 0; padding-bottom: 6px; }
.runs li { flex: none; display: grid; gap: 0; padding: 4px 16px 4px 0; margin-right: 16px; border-radius: 0;
  border-right: 1px solid var(--line); background: none !important; max-width: 220px; }
.runs li:last-child { border-right: 0; }
.runs li .badge { order: -1; }
.runs li .label { font: 600 15px var(--slab); }
.runs li .label small { font: italic 12.5px var(--serif); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.runs li:hover .label { color: var(--accent); }
.runs li.selected { box-shadow: inset 0 -2px 0 var(--accent); }
.runs li.selected .label { color: var(--accent); }
.runs li.all .label { font: italic 15px var(--serif); color: var(--accent); align-self: end; }
/* A state as small capitals in its colour. */
.badge { border: 0; padding: 0; border-radius: 0; font: 600 13px/1.2 var(--serif); font-variant: small-caps;
  text-transform: lowercase; letter-spacing: .6px; align-self: flex-start; }
/* The page: a document's column for the report, the whole width for the tools. */
main { max-width: 1060px; width: 100%; min-width: 0; margin: 0 auto; padding: 36px 24px 80px; }
#main:not([data-view="report"]):not([data-view="runs"]) { max-width: none; padding-inline: max(24px, calc((100% - 1060px) / 2)); }
#main[data-view="explorer"]:not([data-view="report"]):not([data-view="runs"]) { padding-inline: 32px; }
#main > div:first-child h2 { font: 500 44px/1.05 var(--slab); letter-spacing: -.6px; }
#main > div:first-child { align-items: center !important; flex-wrap: wrap; }
#main > .muted { font-style: italic; font-size: 15px; }
#run-resume, #run-again, #run-stop, #run-full { background: none; border: 0; padding: 0 !important; color: var(--accent);
  font: 15px var(--serif) !important; margin-right: 16px; }
#run-full { font-weight: bold !important; }
#run-resume:hover, #run-again:hover, #run-stop:hover, #run-full:hover { text-decoration: underline; }
.progress { background: var(--panel-2); }
.view-tabs { display: flex; flex-wrap: wrap; border: 0; border-radius: 0; border-bottom: 1px solid var(--ink); margin: 26px 0 8px; gap: 26px; overflow: visible; }
.view-tabs button { font: 600 17px var(--slab); color: var(--muted); padding: 0 0 8px; background: none; border-bottom: 3px solid transparent; }
.view-tabs button.on { color: var(--ink); background: none; border-bottom-color: var(--ink); }
/* Figures in a row between rules. */
.stats { gap: 0; margin-top: 24px; border-top: 2px solid var(--ink); border-bottom: 1px solid var(--line); }
.stat { background: none; border: 0; border-radius: 0; border-right: 1px solid var(--line); padding: 14px 18px 16px; }
.stat:last-child { border-right: 0; }
.stat .title { font: 600 15px var(--serif); font-variant: small-caps; text-transform: lowercase; letter-spacing: .8px; }
.stat .value { font: 500 40px/1.1 var(--slab); letter-spacing: -.8px; }
.stat .note { font-style: italic; font-size: 13.5px; }
/* Charts as captioned figures. */
.charts { gap: 34px 40px; margin-top: 30px; }
.chart { background: none; border: 0; border-top: 1px solid var(--ink); border-radius: 0; padding: 10px 0 0; }
.chart .head { flex-direction: column; align-items: flex-start; gap: 2px; }
.chart .head h3 { font: 600 17px var(--slab); }
.chart .head span { font-style: italic; font-size: 13.5px; }
.legend { font-style: italic; }
/* Sections as chapters: numbered in the report, the reference last as appendices. A closed one
   says so (▸ and "show"), its summary the line's only content. */
section { background: none; border: 0; border-radius: 0; border-top: 2px solid var(--ink); margin: 40px 0 0; }
section > header { padding: 12px 0 10px; gap: 12px; align-items: baseline; flex-wrap: wrap; }
section > header::before { content: "▾"; color: var(--muted); font-size: 15px; width: 12px; }
section.closed > header::before { content: "▸"; }
section > header::after { content: "hide"; margin-left: auto; color: var(--accent); font: italic 14px var(--serif); }
section.closed > header::after { content: "show"; }
section > header:hover::after { text-decoration: underline; }
section > header h3 { font: 500 26px/1.15 var(--slab); }
section > header .summary { font-style: italic; font-size: 15px; }
section > .body { padding: 6px 0 12px; }
#main[data-view="report"] { counter-reset: chapter; }
#main[data-view="report"] > section > header h3::before { counter-increment: chapter; content: counter(chapter) ". "; }
.appendices { counter-reset: appendix; margin-top: 56px; }
.appendices > section { border-top-width: 1px; margin-top: 28px; }
.appendices > section > header h3 { font-size: 21px; }
.appendices > section > header h3::before { counter-increment: appendix; content: "Appendix " counter(appendix, upper-alpha) ". "; }
/* Booktabs tables. */
table { font-size: 14px; border-top: 1.5px solid var(--ink); border-bottom: 1.5px solid var(--ink); }
th { color: var(--ink); font: 600 14px var(--serif); border-bottom: 1px solid var(--ink); }
td { border-bottom: 0; }
tr.clickable:hover { background: var(--panel-2); }
.property { border-top: 1px dotted var(--line); }
/* A long count line (a failing property's rates) wraps below its name, never squeezes it. */
.property > .row { flex-wrap: wrap; row-gap: 2px; }
.property > .row .name { flex: 1 1 22em; min-width: 0; }
.property > .row .counts { flex: 0 1 auto; text-align: right; }
.property > .row .counts { font-family: var(--serif); font-style: italic; font-size: 13.5px; }
.chip, .tabs:not(.view-tabs) { border-radius: 0; }
.tabs:not(.view-tabs) button.on { background: var(--ink); color: var(--bg); }
input, select, textarea { border-radius: 0; background: var(--panel); }
button { border-radius: 2px; }
.tip { border-radius: 0; font-family: var(--serif); }
dialog { border-radius: 0; background: var(--bg); }
dialog h3 { font: 500 22px var(--slab); }
.mono, .kv dd, .logs table td { font-size: 12.5px; }
.empty h2 { font: 500 32px var(--slab); }
/* The runs index. */
#main[data-view="runs"] > h2 { font: 500 44px/1.05 var(--slab); letter-spacing: -.6px; margin: 0; }
.index-meta { font-style: italic; margin: 6px 0 22px; }
.runs-index td { padding: 5px 8px; border-bottom: 1px dotted var(--line); }
.runs-index .badge { font-size: 14px; }
.index-section { font: 500 26px var(--slab); margin: 34px 0 10px; }
@media (max-width: 760px) {
  aside { grid-template-columns: minmax(0, 1fr) auto; padding-inline: 16px; }
  aside #runs-filter { grid-column: 1 / -1; max-width: none; order: 2; }
  main, #main:not([data-view="report"]):not([data-view="runs"]), #main[data-view="explorer"]:not([data-view="report"]):not([data-view="runs"]) { padding-inline: 16px; }
  #main > div:first-child h2, #main[data-view="runs"] > h2 { font-size: 32px; }
  .stat { border-right: 0; border-bottom: 1px solid var(--line); min-width: 0; }
  .stat .value { font-size: 32px; }
  .charts { grid-template-columns: minmax(0, 1fr); }
  .chart, section { min-width: 0; overflow-x: auto; }
  .examples { margin-left: 0; }

<script>
"use strict";
const state = {
  runs: [], runId: null, run: null, poll: null, tab: "all", filter: "", logs: null,
  causality: new Map(), // Property message -> its latest causality analysis (causalityRefresh).
  causalityLoaded: null, causalityTimer: null,
  view: "report", property: null, notebook: null, // The run's notebook: cells, their outputs, action results.
  // Sections shown expanded: in the report only Findings (the run's answer; the full property
  // list and the rest a click away), the map and the output in their own views.
  open: new Set(["findings", "map", "output"]),
  discovery: null, // The last discovery chart drawn ({runId, html}): kept until the next one.
  refreshing: false, // A refresh in flight: polls do not pile up behind a slow one.
  examples: new Map(), // A property's examples once loaded (by message), and those shown open.
  examplesOpen: new Set(),
};
const $ = (selector, root = document) => root.querySelector(selector);
const escape = (text) => String(text).replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const seconds = (ns) => (ns / 1e9).toFixed(3) + "s";
// Each node's CPU time over the guest's uptime, the busiest first (det-init's node_cpu events).
function cpuByNode(run) {
  let shares = run.stats && run.stats.cpu_by_node;
  if (typeof shares === "string") { try { shares = JSON.parse(shares); } catch { shares = null; } }
  const entries = shares ? Object.entries(shares).sort((a, b) => b[1] - a[1]) : [];
  return entries.length ? entries.map(([node, share]) => `${node} ${(share * 100).toFixed(0)}%`).join(", ") : "–";
}
// Commands run in nodes by their CPU over the guest's uptime and how many a timeline ran, the
// costliest first (det-init's exec_cpu events): a runtime started per call shows here.
function cpuByExec(run) {
  let shares = run.stats && run.stats.cpu_by_exec;
  if (typeof shares === "string") { try { shares = JSON.parse(shares); } catch { shares = null; } }
  const entries = shares ? Object.entries(shares).sort((a, b) => b[1].share - a[1].share) : [];
  return entries.length
    ? entries.map(([name, cost]) => `${name} ${(cost.share * 100).toFixed(0)}% (${cost.execs} a timeline)`).join(", ")
    : "–";
}
// A run's efficiency figure: its summary's once it ended, else its explorer's live status; "–"
// for runs from before they were measured.
function efficiencyOf(run, key, format) {
  const summary = run.summary || {};
  // A summary records the nodes and virtual per wall; their product is the per-node figure.
  if (key === "per_node" && summary.nodes && summary.vtime_per_wall) return format(summary.nodes * summary.vtime_per_wall);
  const source = summary[key] !== undefined ? summary
    : run.progress && run.progress[key] !== undefined ? run.progress : null;
  return source ? format(source[key]) : "–";
}
const quote = (text) => '"' + String(text).replace(/\\/g, "\\\\").replace(/"/g, '\\"') + '"';
const sqlString = (text) => "'" + String(text).replace(/'/g, "''") + "'";

// (A section's own SQL goes to /runs/<id>/sql?page=1: what is ingested, never an ingest of its
// own on a running run, as the page's other answers.)
async function api(path, body) {
  const response = await fetch(path, body === undefined ? {} : {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
  });
  const text = await response.text();
  if (!response.ok) throw new Error(text);
  return text;
}
const apiJson = async (path, body) => JSON.parse(await api(path, body));
const lines = (text) => text.split("\n").filter((line) => line.trim()).map((line) => JSON.parse(line));
const query = async (request) => lines(await api(`/runs/${state.runId}/query`, request));

// Runs ------------------------------------------------------------------------------------
// A run, from its events database: its record and stats, its timelines, its properties.
// A run's timelines are kept (a long run's list is megabytes): each refresh asks only for those
// ingested since (in the order they finished), and for the whole list again only if the page
// has more than the run (another run under the same number).
const timelinesKept = new Map(); // Run id -> its timelines, by index.
// Everything a run's page shows, in one wave of requests side by side: each costs a round trip
// (120 ms from a laptop to a server across an ocean), and in turn they added up to seconds.
async function runFetch(id) {
  let kept = timelinesKept.get(id);
  // Not the failures: the tree's alone, fetched by it when timelines finished since (a long
  // running run's take seconds of its database each time it changes).
  // A run whose events cannot be read (its --events-dir deleted, or another run's since) still
  // opens, saying so, instead of loading forever.
  let eventsError = null;
  const events = (promise, empty) => promise.catch((error) => { eventsError = eventsError || error.message; return empty; });
  const [info, properties, fetched, discovery] = await Promise.all([
    apiJson(`/runs/${id}`), events(apiJson(`/runs/${id}/properties`), []),
    events(apiJson(kept ? `/runs/${id}/timelines?offset=${kept.length}` : `/runs/${id}/timelines`), []),
    apiJson(`/runs/${id}/discovery`).catch(() => null)]);
  const failures = null;
  // Every timeline: what the run explored, and those that extend one (sessions).
  const total = info.stats && info.stats.timelines + (info.stats.extending || 0);
  if (!kept) kept = fetched;
  // Fewer than kept: the run's database was made again; all of them anew.
  else if (total != null && kept.length > total) kept = await apiJson(`/runs/${id}/timelines`);
  else if (fetched.length) kept = kept.concat(fetched).sort((a, b) => a.index - b.index);
  timelinesKept.set(id, kept);
  // What the run explored: its timelines but a person's sessions (each extends one). The
  // report's counts and statistics are over these; the map, the logs and the queries show all.
  return { ...info, branches: kept, explored: kept.filter((b) => b.extends == null), properties, discovery, failures, eventsError };
}
// Runs forked from moments of others, kept once they ended: subtrees in the tree.
const details = new Map();
async function runDetails(run) {
  const known = details.get(run.id);
  if (known && known.state !== "running") return known;
  try { details.set(run.id, await runFetch(run.id)); } catch { /* Not yet. */ }
  return details.get(run.id);
}
function runLabel(run) {
  const fork = run.from_branch != null ? ` · fork of #${run.from_branch}` : "";
  // A CI job's run (determinismo-ci): where its tests come from, not a system and scenario.
  const ci = run.ci || (state.runs || []).find((listed) => listed.id === run.id)?.ci;
  if (ci) return escape(`${ci.repository} · ${ci.branch} · ${ci.commit.slice(0, 10)}` + fork);
  return escape([run.system, run.scenario].filter(Boolean).join(" · ") + fork);
}
// The run list's filter (Antithesis's Run ID filter): a run whose id, system, scenario or state
// holds every word of it; kept in this browser and in the page's URL (`?runs=`, Antithesis's
// Runs view links keep their filters: a link opens filtered, before this browser's own).
let runsFilter = "";
try { runsFilter = localStorage.getItem("determinismo.runs-filter") || ""; } catch { /* This page's only. */ }
const linkedFilter = new URLSearchParams(location.search).get("runs");
if (linkedFilter !== null) runsFilter = linkedFilter;
// One query parameter set or removed, the others (and the run's hash) kept.
function queryParamSet(name, value) {
  const params = new URLSearchParams(location.search);
  if (value) params.set(name, value); else params.delete(name);
  const query = params.toString();
  history.replaceState(null, "", location.pathname + (query ? "?" + query : "") + location.hash);
}
function runMatches(run) {
  const words = runsFilter.toLowerCase().split(/\s+/).filter(Boolean);
  const text = `${run.id} ${run.system || ""} ${run.scenario || ""} ${run.state || ""} ${run.ci ? `${run.ci.repository} ${run.ci.branch} ${run.ci.commit}` : ""}`.toLowerCase();
  return words.every((word) => text.includes(word));
}
async function runsRefresh() {
  try { state.runs = await apiJson("/runs"); } catch { return; }
  runsDraw();
}
// The masthead's latest runs (the open one among them), then the way to every run: the runs
// index (#runs), a table of them all, filtered as the masthead is.
const runsShown = 10;
function runsDraw() {
  const list = $("#runs");
  if (!list || !state.runs) return;
  const matching = state.runs.slice().reverse().filter(runMatches);
  const shown = matching.slice(0, runsShown);
  const open = matching.find((run) => run.id === state.runId);
  if (open && !shown.includes(open)) shown.push(open);
  const html = shown.map((run) =>
    `<li data-id="${run.id}" class="${run.id === state.runId && !state.indexOpen ? "selected" : ""}">
       <span class="label">Run ${run.id}<small>${runLabel(run)}</small></span>${stateBadge(run.state)}</li>`).join("")
    + `<li class="all${state.indexOpen ? " selected" : ""}" data-all="1"><span class="label">All runs<small>${matching.length.toLocaleString()}${runsFilter ? " matching" : ""}</small></span></li>`
    + (state.runs.some((run) => run.ci) ? `<li class="all${location.hash === "#ci" ? " selected" : ""}" data-ci="1"><span class="label">CI jobs<small>${state.runs.filter((run) => run.ci).length.toLocaleString()}</small></span></li>` : "");
  // Redrawn only when it changed: each refresh (every 5 s) drew it anew, the page shaking.
  if (list.dataset.drawn !== html) {
    list.innerHTML = html;
    list.dataset.drawn = html;
    list.querySelectorAll("li").forEach((item) =>
      item.addEventListener("click", () => item.dataset.ci ? ciOpen() : item.dataset.all ? runsIndexOpen() : runOpen(Number(item.dataset.id))));
  }
  runsIndexDraw();
}
function runsIndexOpen() {
  state.indexOpen = true;
  clearTimeout(state.poll);
  // From a run: a step in the history (Back returns to it); a page opened bare: named.
  if (location.hash !== "#runs") history[location.hash ? "pushState" : "replaceState"](null, "", "#runs");
  $("#main").dataset.view = "runs";
  delete $("#main").dataset.drawn; // The page shows something else now: the list drawn again.
  if (!state.runs) $("#main").innerHTML = `<div class="empty"><h2>Runs</h2><div class="muted">Loading…</div></div>`;
  runsDraw();
  window.scrollTo(0, 0);
}
// The runs index, with the machines under it, drawn whole and only when it changed: the
// refresh every 5 s drew the runs, then added the machines once they answered, the page
// jumping each time.
let indexToken = 0;
async function runsIndexDraw() {
  if (!state.indexOpen || !state.runs) return;
  const token = ++indexToken; // Only the newest draw's answers are drawn.
  const machines = await fetch("/machines").then((r) => r.ok ? r.json() : []).catch(() => []);
  if (!state.indexOpen || token !== indexToken) return;
  const matching = state.runs.slice().reverse().filter(runMatches);
  const counts = {};
  for (const run of state.runs) counts[run.state] = (counts[run.state] || 0) + 1;
  const html = `<h2>Runs</h2>
    <div class="muted index-meta">${state.runs.length.toLocaleString()} runs · ${Object.entries(counts).map(([name, n]) => `${n.toLocaleString()} ${escape(name)}`).join(" · ")}
      ${runsFilter ? ` · ${matching.length.toLocaleString()} matching “${escape(runsFilter)}”` : ""}</div>
    <table class="runs-index"><tr><th>Run</th><th>State</th><th>System</th><th>Scenario</th><th>From</th></tr>
    ${matching.map((run) => `<tr class="clickable" data-id="${run.id}"><td class="mono">${run.id}</td><td>${stateBadge(run.state)}</td>
      <td class="mono">${escape(run.ci ? run.ci.repository : run.system || "")}</td><td>${escape(run.ci ? `CI job · ${run.ci.branch} · ${run.ci.commit.slice(0, 10)}` : run.scenario || "")}</td>
      <td class="muted">${run.from_run != null ? `run ${run.from_run}, timeline ${run.from_branch}`
        : run.checkpoint ? `machine ${escape(run.checkpoint.split("/")[0])}, checkpoint ${escape(run.checkpoint.split("/")[1] ?? "")}` : ""}</td></tr>`).join("")}</table>
    ${machines.length ? `<h3 class="index-section">Machines</h3>
    <table class="runs-index"><tr><th>Machine</th><th>State</th><th>Checkpoints</th><th>Directory</th></tr>
    ${machines.map((m) => `<tr><td class="mono">${m.machine}</td><td>${stateBadge(m.alive ? "running" : "stopped")}</td>
      <td>${m.checkpoints}</td><td class="mono muted">${escape(m.directory)}</td></tr>`).join("")}</table>` : ""}`;
  const main = $("#main");
  if (main.dataset.view === "runs" && main.dataset.drawn === html) return;
  main.innerHTML = html;
  main.dataset.drawn = html;
  main.querySelectorAll("tr.clickable").forEach((row) => row.addEventListener("click", () => runOpen(Number(row.dataset.id))));
}
{
  const filter = $("#runs-filter");
  filter.value = runsFilter;
  filter.addEventListener("input", () => {
    runsFilter = filter.value;
    try { localStorage.setItem("determinismo.runs-filter", runsFilter); } catch { /* This page's only. */ }
    queryParamSet("runs", runsFilter);
    runsDraw();
  });
}
function stateBadge(name) {
  const kind = { passed: "pass", failed: "fail", running: "running", stopped: "stopped", interrupted: "stopped", setup: "running", testing: "running", flaky: "stopped" }[name] || "error";
  return `<span class="badge ${kind}">${escape(name)}</span>`;
}

// A run's views, each its own page (#<id>/<view>), as Antithesis splits its results: the
// report (findings, environment, utilization, properties), the Logs Explorer (search, the
// multiverse tree, logs), the explorer's output, the notebook. Only the open one is drawn and
// kept up to date: one page holding all of them (the tree alone 100,000 SVG elements in a run of
// 2,500 timelines) was busy 70% of the time with its refreshes.
const views = [["report", "Report"], ["explorer", "Logs explorer"], ["output", "Output"], ["notebook", "Notebook"]];
// A property has a page of its own (#<id>/property/<its message>): its examples, the
// statistic of what its failures drew and the lead-up of one, which in the list made a long
// page hard to follow; the list stays one line a property.
function routeOf(hash) {
  const [id, view, ...rest] = hash.replace(/^#/, "").split("/");
  if (view === "property" && rest.length) return { id: Number(id), view, property: decodeURIComponent(rest.join("/")), timeline: null };
  // A timeline's logs, with its card (#<id>/explorer/<timeline>): a link to send.
  const timeline = view === "explorer" && rest.length && /^\d+$/.test(rest[0]) ? Number(rest[0]) : null;
  return { id: Number(id), view: views.some(([name]) => name === view) ? view : "report", property: null, timeline };
}
const propertyHash = (message) => `#${state.runId}/property/${encodeURIComponent(message)}`;
function routeSet() {
  const hash = state.view === "property" ? propertyHash(state.property)
    : `#${state.runId}${state.view === "report" ? "" : "/" + state.view}`;
  if (location.hash === hash) return;
  // Somewhere else (another run, view or property, or from the list): a step in the browser's
  // history, so Back returns; the same place named otherwise (a default view spelled out, a
  // bare page): the address replaced.
  const at = routeOf(location.hash);
  const moved = location.hash !== "" && (at.id !== state.runId || at.view !== state.view || at.property !== state.property);
  history[moved ? "pushState" : "replaceState"](null, "", hash);
}
// Opening a property's page is a step in the browser's history: Back returns to the list, at it.
function propertyOpen(message) { location.hash = propertyHash(message); }

async function runOpen(id, view, property = null, timeline = null) {

    const noteHtml = note ? `<span class="muted" style="font-size:12px">${note}</span>` : "";
    return `<li style="display:flex;gap:10px;align-items:baseline">${badge}<code>${where}</code>${noteHtml}</li>`;
  }).join("");
  return `<ul style="list-style:none;padding:0;margin:0;display:grid;gap:6px">${rows}</ul>`;
}

// The explorer's own lines (its progress every half minute, its timelines, its verdicts), the
// last 300, kept at the bottom while the reader is there.
async function outputDraw() {
  const box = $("#output-body");
  if (!box || $("#output").classList.contains("closed")) return;
  const id = state.runId;
  let text;
  try { text = await api(`/runs/${id}/output?lines=300&explorer=1`); } catch { return; }
  if (id !== state.runId || !$("#output-body")) return;
  const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 40;
  box.textContent = text.trim() || "Nothing yet: the system is being built and booted.";
  box.classList.toggle("muted", !text.trim());
  if (atBottom) box.scrollTop = box.scrollHeight;
}

// How busy a tree's workers were: timelines running at once on average, of how many, and how
// long their VMs waited for the host's memory and for a CPU (the explorer's
// status while it runs, its summary after). A hunt whose CPUs sit idle says so here.
function atOnce(run) {
  const live = run.state === "running" ? run.progress : null;
  const known = live && live.workers ? { workers: live.workers, at_once: live.at_once, memory_s: live.memory_wait_s, cpu_s: live.cpu_wait_s || 0 }
    : run.summary && run.summary.workers ? { workers: run.summary.workers, at_once: run.summary.at_once, memory_s: (run.summary.memory_wait_ns || 0) / 1e9, cpu_s: (run.summary.cpu_wait_ns || 0) / 1e9 }
    : null;
  if (!known) return "–";
  const share = Math.round(100 * known.at_once / known.workers);
  return `${known.at_once.toFixed(1)} of ${known.workers} workers (${share}%)`
    + (known.memory_s >= 1 ? ` · VMs waited ${Math.round(known.memory_s)} s for memory` : "")
    + (known.cpu_s >= 1 ? ` · ${Math.round(known.cpu_s)} s for a CPU` : "");
}
function utilizationSummary() {
  const vtime = state.run.explored.reduce((sum, branch) => sum + branch.vtime_ns, 0);
  return `${(vtime / 1e9).toFixed(1)} virtual seconds explored`;
}
function utilizationBody() {
  const run = state.run;
  const vtime = run.explored.reduce((sum, branch) => sum + branch.vtime_ns, 0);
  // The run's own wall time (its summary's once it ended; since its explorer started meanwhile),
  // never its timelines' added up.
  const wall = run.summary ? run.summary.wall_ns : run.started_s ? Math.max(0, Date.now() / 1000 - run.started_s) * 1e9 : 0;
  const rows = [
    ["Branches", `${run.explored.length} of ${(run.run || {}).branches || "?"}`],
    ["Virtual time", seconds(vtime)],
    ["Wall time", seconds(wall)],
    ["Timelines at once", atOnce(run)],
    ["Virtual per wall (one core)", run.summary && run.summary.vtime_per_wall
      ? run.summary.vtime_per_wall.toFixed(2) + "×" : "–"],
    // Antithesis's rule of thumb (virtual per wall x nodes above 1), and why a run is slow: an
    // idle guest is skipped (little idle: something busy-waits), each clock read is an exit.
    ["Virtual per wall x nodes", efficiencyOf(run, "per_node", (v) => v.toFixed(2) + (v < 1 ? " (below 1: heavy nodes)" : ""))],
    ["Idle, skipped", efficiencyOf(run, "idle_share", (v) => (v * 100).toFixed(0) + "%" + (v < 0.05 ? " (something busy-waits)" : ""))],
    ["Clock reads per virtual s", efficiencyOf(run, "clock_reads_per_s", (v) => Math.round(v).toLocaleString())],
    ["CPU by node", cpuByNode(run)],
    ["CPU by command run in a node", cpuByExec(run)],
    // Who wrote the output the logging limit counts (its summary's top sources).
    ["Output by source", outputBySource(run)],
    ["Exact stops", run.summary ? `largest skid ${run.summary.skid_max} branches, ${run.summary.overshoots} overshoots` : "–"],
  ];
  return `<dl class="kv">${rows.map(([key, value]) => `<dt>${key}</dt><dd>${escape(value)}</dd>`).join("")}</dl>
    <div class="muted" style="max-width:720px;margin-top:10px">New behavior discovery (above): a curve still climbing says run longer;
      one flat for long says these tests found what they can: strengthen them (more drivers, assertions, faults) to find more.</div>`;
}
// report.zig's run-wide logging limit: under its bar, who wrote the output.
const loggingProperty = "logging output stays under 200 MB per hour of virtual time";
// The sources that wrote the most of the run's output, each with its share: "n2 12.0 MB (46%), ...".
function outputBySource(run) {
  const summary = run.summary || {};
  const sources = summary.output_sources || [];
  if (!sources.length || !summary.output_bytes) return "–";
  const mb = (bytes) => (bytes / 1e6).toFixed(1) + " MB";
  // Under a hundredth of it, a source says nothing (the kernel's few lines of a flood).
  const shown = sources.filter((s, index) => index === 0 || s.bytes / summary.output_bytes >= 0.01);
  return shown.map((s) => `${s.source} ${mb(s.bytes)} (${Math.round(100 * s.bytes / summary.output_bytes)}%)`).join(", ")
    + ` of ${mb(summary.output_bytes)}`;
}
// The chart drawn last for this run: shown again while the next one loads (no flicker).
const discoveryKept = () => state.discovery && state.discovery.runId === state.runId ? state.discovery.html : null;
async function discoveryDraw() {
  const id = state.runId;
  let points;
  try { points = (state.run && state.run.id === id && state.run.discovery || await apiJson(`/runs/${id}/discovery`)).points; } catch (error) {
    const box = $("#discovery");
    if (box && !discoveryKept()) box.textContent = `No events recorded (${error.message}).`;
    return;
  }
  const box = $("#discovery");
  if (!box || id !== state.runId) return;
  if (!points.length) { if (!discoveryKept()) box.textContent = "No timelines yet."; return; }
  const width = Math.max(320, box.clientWidth), height = 170, left = 44, bottom = 22;
  const maxX = Math.max(1, points[points.length - 1][0]), maxY = Math.max(1, ...points.map((p) => p[1]));
  const x = (v) => left + (width - left - 12) * v / maxX, y = (v) => height - bottom - (height - bottom - 10) * v / maxY;
  const line = points.map(([b, n], i) => `${i ? "L" : "M"}${x(b).toFixed(1)},${y(n).toFixed(1)}`).join(" ");
  const area = `${line} L${x(maxX).toFixed(1)},${y(0)} L${x(0)},${y(0)} Z`;
  const ticksX = [0, 0.25, 0.5, 0.75, 1].map((f) => Math.round(maxX * f)).map((v) =>
    `<text x="${x(v)}" y="${height - 4}" fill="#6b6455" font-size="10" text-anchor="middle">${v}</text>`).join("");
  const ticksY = [0, 0.5, 1].map((f) => Math.round(maxY * f)).map((v) =>
    `<text x="${left - 8}" y="${y(v) + 4}" fill="#6b6455" font-size="10" text-anchor="end">${v.toLocaleString()}</text>
     <line x1="${left}" x2="${width - 12}" y1="${y(v)}" y2="${y(v)}" stroke="#d6cba3" stroke-dasharray="${v ? "2 4" : ""}"/>`).join("");
  box.innerHTML = `<svg width="${width}" height="${height}">${ticksY}<path d="${area}" fill="#1a4f8b" opacity=".14"/>
    <path d="${line}" fill="none" stroke="#1a4f8b" stroke-width="2.2"/>${ticksX}</svg>`;
  box.classList.remove("muted");
  state.discovery = { runId: id, html: box.innerHTML };
  if ($("#behaviors")) $("#behaviors").textContent = maxY.toLocaleString();
}

// Over time (GET /runs/<id>/activity, activity.zig): per minute of wall time, how fast the run
// went (timelines and virtual hours an hour), where its workers' time went, the memory left. A
// run slowing down by its end (run 454) showed none of it in its averages.
const activityParts = [
  ["running", "Timelines running", "#2f6fb3"],
  ["waiting", "Timelines waiting for memory or a CPU", "#c0612b"],
  ["holders", "Nodes from holders", "#3d8b5f"],
  ["replays", "Nodes replayed from the parent's start", "#a87400"],
  ["verify", "Verification replays", "#b0457a"],
  ["setup", "Setup", "#008300"],
];
function activityOf(minute) {
  const busy = minute.busy_s;
  const waiting = Math.min(busy.timeline, minute.wait_s);
  return { running: busy.timeline - waiting, waiting, holders: busy.node_memory + busy.node_disk,
    replays: busy.node_replay, verify: busy.verify, setup: busy.setup };
}
function activityHtml() {
  const box = (id, title, note) => `<div class="chart"><div class="head"><h3>${title}</h3><span id="${id}-note">${note}</span></div>
    <div id="${id}" class="muted">${state.activity && state.activity.runId === state.runId ? "" : "Loading…"}</div>${id === "activity-workers" ? `<div id="activity-legend" class="legend"></div>` : ""}</div>`;
  return `<div class="charts" id="activity-charts">
    ${box("activity-rate", "Timelines per hour", "5-minute average, by minute of wall time")}
    ${box("activity-vtime", "Virtual hours per hour", "virtual time explored, 5-minute average")}
    ${box("activity-workers", "Workers by activity", "")}
    ${box("activity-memory", "Memory available", "the host's, lowest each minute")}
    ${box("activity-known", "Behaviors known", "the tree's own, as its generations are judged")}
  </div>`;
}
// Fetched at most every 20 s while the run goes on (the whole log parsed each time).
async function activityDraw() {
  const id = state.runId;
  const known = state.activity && state.activity.runId === id ? state.activity : null;
  if (!known || (state.run.state === "running" && Date.now() - known.at > 20000)) {
    try {
      const data = await apiJson(`/runs/${id}/activity`);
      state.activity = { runId: id, at: Date.now(), data };
    } catch (error) {
      for (const box of document.querySelectorAll("#activity-charts .chart > div[id]")) box.textContent = `No activity (${error.message}).`;
      return;
    }
  }
  if (id !== state.runId) return;
  const data = state.activity.data;
  const minutes = data.minutes;
  if (!minutes.length) {
    for (const name of ["rate", "vtime", "workers", "memory", "known"]) {
      const box = $(`#activity-${name}`);
      if (box) box.textContent = "Not recorded for this run (runs from 2026-11-02 on).";
    }
    return;
  }
  // Only while it runs: an ended run's timelines open at its last sample were stopped.
  const settling = data.settling_ms && state.run.state === "running" ? Math.floor((data.settling_ms - data.start_ms) / 60000) : null;
  // The seconds each minute covers: the last only up to the log's last line (its rates scaled).
  const covered = (at) => at < minutes.length - 1 ? 60 : Math.max(1, Math.min(60, (data.end_ms - data.start_ms) / 1000 - at * 60));
  const average = (values, at) => {
    const window = values.slice(Math.max(0, at - 4), at + 1).filter((v) => v != null);
    return window.length ? window.reduce((a, b) => a + b, 0) / window.length : null;
  };
  const rate = minutes.map((m, at) => m.timelines * 3600 / covered(at));
  const vtime = minutes.map((m, at) => m.vtime_s / covered(at));
  const label = (at) => `<div class="t-title">Minute ${at + 1} (${at}–${at + 1} min)</div>`;
  minuteChart("#activity-rate", minutes.length, { lines: [{ values: rate.map((_, at) => average(rate, at)), color: "#1a4f8b" }], settling,
    tip: (at) => label(at) + kvHtml([["Timelines ended", minutes[at].timelines], ["Per hour, this minute", rate[at]], ["Per hour, 5-minute average", Math.round(average(rate, at))]]),
    format: (v) => Math.round(v).toLocaleString() });
  minuteChart("#activity-vtime", minutes.length, { lines: [{ values: vtime.map((_, at) => average(vtime, at)), color: "#2f6fb3" }], settling,
    tip: (at) => label(at) + kvHtml([["Virtual time explored", duration(minutes[at].vtime_s)], ["Virtual hours per hour, this minute", vtime[at].toFixed(1)], ["5-minute average", average(vtime, at).toFixed(1)]]),
    format: (v) => v.toFixed(v < 10 ? 1 : 0) });
  const parts = minutes.map(activityOf);
  const workers = data.workers;
  const totals = Object.fromEntries(activityParts.map(([key]) => [key, parts.reduce((sum, part) => sum + part[key], 0)]));
  const capacity = workers * minutes.reduce((sum, _, at) => sum + covered(at), 0);
  const used = Object.values(totals).reduce((a, b) => a + b, 0);
  const share = (s) => capacity ? `${Math.round(100 * s / capacity)}%` : "–";
  const hours = (s) => s >= 3600 ? `${(s / 3600).toFixed(1)} worker-h` : `${Math.round(s / 60)} worker-min`;
  minuteChart("#activity-workers", minutes.length, {
    stack: activityParts.map(([key, , color]) => ({ values: parts.map((part, at) => part[key] / covered(at)), color })),
    reference: workers, settling,
    tip: (at) => label(at) + kvHtml([...activityParts.map(([key, name]) => [name, (parts[at][key] / covered(at)).toFixed(1)]),
      ["Idle", Math.max(0, workers - Object.values(parts[at]).reduce((a, b) => a + b, 0) / covered(at)).toFixed(1)],
      ["Running (sampled)", minutes[at].running], ["Nodes being made (sampled)", minutes[at].nodes], ["Queued (sampled)", minutes[at].queued]]),
    format: (v) => v.toFixed(0) });
  const note = $("#activity-workers-note");
  if (note) note.textContent = `average busy, of ${workers} workers`;
  const legend = $("#activity-legend");
  if (legend) legend.innerHTML = activityParts.filter(([key]) => totals[key] > 0).map(([key, name, color]) =>
    `<span><i style="background:${color}"></i>${name} <b>${share(totals[key])}</b> · ${hours(totals[key])}</span>`).join("")
    + `<span><i style="background:transparent;border:1px dashed var(--muted)"></i>Idle <b>${share(Math.max(0, capacity - used))}</b> · ${hours(Math.max(0, capacity - used))}</span>`;
  // Carried forward between judgments: what the tree knew at each minute.
  let knownSoFar = null;
  const knownByMinute = minutes.map((m) => (knownSoFar = m.known ?? knownSoFar));
  if (knownByMinute.every((v) => v == null)) {
    const box = $("#activity-known");
    if (box) box.textContent = "No generation judged yet.";
  } else minuteChart("#activity-known", minutes.length, { lines: [{ values: knownByMinute, color: "#1a4f8b" }],
    tip: (at) => label(at) + kvHtml([["Known", knownByMinute[at] ?? "–"], ["New in generations judged this minute", minutes[at].found ?? 0]]),
    format: (v) => Math.round(v).toLocaleString() });
  minuteChart("#activity-memory", minutes.length, { lines: [{ values: minutes.map((m) => m.available_gb ?? null), color: "#3d8b5f" }],
    tip: (at) => label(at) + kvHtml([["Available, lowest", minutes[at].available_gb != null ? `${minutes[at].available_gb} GB` : "–"]]),
    format: (v) => `${Math.round(v)} GB` });
}
// One chart of per-minute values: lines (gaps where null) or a stack of areas, a dashed
// reference (the workers), the minutes still filling in shaded, a tooltip per minute.
function minuteChart(selector, count, { lines = [], stack = null, reference = null, settling = null, tip, format }) {
  const box = $(selector);
  if (!box) return;
  const width = Math.max(320, box.clientWidth), height = 170, left = 44, bottom = 22, top = 10;
  let tops = null;
  if (stack) {
    tops = [];
    let below = new Array(count).fill(0);
    for (const layer of stack) { const above = below.map((v, at) => v + (layer.values[at] || 0)); tops.push({ below, above, color: layer.color }); below = above; }
  }
  const all = [...lines.flatMap((line) => line.values), ...(tops ? tops[tops.length - 1].above : []), reference || 0].filter((v) => v != null);
  const maxY = Math.max(1e-9, ...all) * 1.08;
  const maxX = Math.max(1, count);
  const x = (at) => left + (width - left - 12) * at / maxX, y = (v) => height - bottom - (height - bottom - top) * v / maxY;
  const step = (width - left - 12) / maxX;
  const ticksY = [0, 0.5, 1].map((f) => maxY / 1.08 * f).map((v) =>
    `<text x="${left - 8}" y="${y(v) + 4}" fill="#6b6455" font-size="10" text-anchor="end">${format(v)}</text>
     <line x1="${left}" x2="${width - 12}" y1="${y(v)}" y2="${y(v)}" stroke="#d6cba3" stroke-dasharray="${v ? "2 4" : ""}"/>`).join("");
  // Every round step of minutes that leaves about four to six ticks.
  const tickStep = [1, 2, 5, 10, 15, 30, 60, 120, 240, 480, 1440].find((s) => maxX / s <= 6) || 2880;
  const ticksX = Array.from({ length: Math.floor(maxX / tickStep) + 1 }, (_, i) => i * tickStep).map((v) =>
    `<text x="${x(v)}" y="${height - 4}" fill="#6b6455" font-size="10" text-anchor="middle">${v >= 120 && v % 60 === 0 ? `${v / 60} h` : `${v} min`}</text>`).join("");
  const shade = settling != null && settling < count ? `<rect x="${x(settling)}" y="${top}" width="${x(count) - x(settling)}" height="${height - bottom - top}" fill="#e9dfb8" opacity=".55"/>
    <text x="${x(count) - 4}" y="${top + 10}" fill="#6b6455" font-size="10" text-anchor="end">still running: fills in as timelines end</text>` : "";
  const paths = lines.map((line) => {
    let d = "", pen = false;
    line.values.forEach((v, at) => { if (v == null) { pen = false; return; } d += `${pen ? "L" : "M"}${(x(at) + step / 2).toFixed(1)},${y(v).toFixed(1)}`; pen = true; });
    return `<path d="${d}" fill="none" stroke="${line.color}" stroke-width="2" stroke-linejoin="round"/>`;
  }).join("");
  const areas = tops ? tops.map((layer) => {
    const upper = layer.above.map((v, at) => `${at ? "L" : "M"}${(x(at) + step / 2).toFixed(1)},${y(v).toFixed(1)}`).join("");
    const lower = layer.below.map((v, at) => `L${(x(at) + step / 2).toFixed(1)},${y(v).toFixed(1)}`).reverse().join("");
    return `<path d="${upper}${lower}Z" fill="${layer.color}" opacity=".85" stroke="var(--panel)" stroke-width="1"/>`;
  }).join("") : "";
  const referenceLine = reference ? `<line x1="${left}" x2="${width - 12}" y1="${y(reference)}" y2="${y(reference)}" stroke="#6b6455" stroke-dasharray="4 3"/>` : "";
  const hits = Array.from({ length: count }, (_, at) => `<rect x="${x(at)}" y="${top}" width="${Math.max(1, step)}" height="${height - bottom - top}" fill="transparent" class="minute-hit" ${tipAttr(tip(at))}/>`).join("");
  box.innerHTML = `<svg width="${width}" height="${height}">${ticksY}${shade}${areas}${paths}${referenceLine}${ticksX}${hits}</svg>`;
  box.classList.remove("muted");
}

// Properties: each assertion with its verdict across the timelines so far (the run's events
// database judges them as Antithesis does).
const builtin = new Set(["test commands exit successfully", "no unexpected container exits",
  "no process crashes (segfault, illegal instruction, ...)",
  "the kernel kills no process for lack of memory", "the kernel reports no warnings, BUGs or hung tasks",
  "the guest finishes its scenario (no panic, hang or crash)",
  "peak memory usage stays under 95% of the machine's memory",
  "logging output stays under 200 MB per hour of virtual time", "host checks run to completion",
  "the fault injector started", "the fault injector never stalls",
  "a node's disk is never left dropping writes", "a faulted node starts again",
  "the nodes' disks fit in the guest's memory",
  "faults leave nothing behind once they stop",
  "timelines replay to their recorded history", "test templates hold only valid commands"]);
// Also determinismo's: a crash named by its process, a language runtime's panic (Go, Rust, Java).
const isBuiltin = (message) => builtin.has(message) || message.startsWith("no process crashes")
  || /^no (panics|fatal errors|data races|uncaught exceptions) \((Go|Rust|Java)\)$/.test(message);
// Antithesis's findability: the failure counted once a subtree (siblings' failures are one
// find), and the run's CPU time over those finds, the mean time to find it again; with its
// finds per CPU-hour as a 95% interval (few finds, a wide one).
function findability(property) {
  if (!property.finds) return "";
  const s = property.find_ns / 1e9;
  const every = s >= 3600 ? `${(s / 3600).toFixed(1)} h` : s >= 60 ? `${(s / 60).toFixed(1)} min` : `${s.toFixed(1)} s`;
  const rate = (value) => value >= 10 ? value.toFixed(0) : value >= 1 ? value.toFixed(1) : value.toPrecision(2);
  const interval = property.rate_high ? ` (${rate(property.rate_low)} to ${rate(property.rate_high)} per CPU-hour, 95%)` : "";
  return ` · found ${property.finds} ${property.finds === 1 ? "time" : "times"} independently, every ${every} of CPU on average${interval}`;
}
function properties() {
  return (state.run.properties || []).map((p) => ({
    kind: p.type, message: p.message, location: p.location, status: p.status,
    failing: p.status === "failing", branches_hit: p.timelines_hit, branches_true: p.timelines_true,
    branches_failing: p.timelines_failing, example_branch: p.first_failing_timeline,
    finds: p.independent_finds, find_ns: p.mean_cpu_ns_to_find,
    rate_low: p.finds_per_cpu_hour_low, rate_high: p.finds_per_cpu_hour_high,
  }));
}
// Failing across the multiverse (a sometimes never true too); an assertion that must be reached
// and was not is "unreached": judged across scenarios.
const isFailing = (property) => property.failing;
function propertiesSummary() {
  const list = properties();
  const failed = list.filter(isFailing).length;
  return `<span class="${failed ? "fail-text" : "pass-text"}">${failed} failing</span> of ${list.length}${state.run.state === "running" ? " (so far)" : ""}`;
}
// Properties a viewer marked (Antithesis's Run View: Favorite pins one at the top, Ignore moves
// it to the bottom), by message, in this browser: they hold across a system's runs.
const marksKey = "determinismo.property-marks";
function marksRead() {
  try { return JSON.parse(localStorage.getItem(marksKey) || "{}") || {}; } catch { return {}; }
}
function marksWrite(marks) {

// A timeline's window around a failure as one page that plays it back with no host (the same
// document as `determinismo runs export --html`: serve's own answers, in the viewer at
// /export.html), saved as a file.
async function exportWindow(button, branch, vtimeNs) {
  const label = button.textContent;
  button.disabled = true;
  button.textContent = "Exporting…";
  try {
    const moment = vtimeNs / 1e9, from = Math.max(0, moment - 30), to = moment + 5;
    const id = Number(state.runId);
    const optional = (path) => api(path).then((text) => JSON.parse(text)).catch(() => null);
    const [events, runInfo, properties, causality, automations, page] = await Promise.all([
      api(`/runs/${id}/query`, { condition: `vtime>=${from.toFixed(6)}`, branch, up_to_vtime: to, limit: 1000000 }),
      apiJson(`/runs/${id}`),
      optional(`/runs/${id}/properties`),
      optional(`/runs/${id}/causality`),
      api(`/runs/${id}/automations`).catch(() => ""),
      api("/export.html"),
    ]);
    const doc = {
      format: "determinismo-export/1", run: id, timeline: branch, moment_s: moment, from_s: from, to_s: to,
      run_info: runInfo, properties, causality,
      automations: lines(automations).filter((row) => row.timeline === branch),
      events: lines(events),
    };
    const embedded = JSON.stringify(doc).replace(/</g, "\\u003c");
    const html = page.replace("/*EXPORT*/", () => embedded);
    const system = ((runInfo.request && (runInfo.request.program_asked || runInfo.request.compose)) || "run").split("/").pop();
    const link = document.createElement("a");
    link.href = URL.createObjectURL(new Blob([html], { type: "text/html" }));
    link.download = `${system}-run${id}-timeline${branch}.html`;
    link.click();
    setTimeout(() => URL.revokeObjectURL(link.href), 10000);
    button.textContent = label;
  } catch (error) {
    button.textContent = "Export failed";
    button.title = error.message;
  } finally {
    button.disabled = false;
  }
}

}

// What led up to a property's first counterexample (Antithesis's Run View): the last events of
// its first failing timeline up to it, the failing one highlighted, and its logs a click away.
const leadUpLines = 12;
async function leadUpDraw(element, message, example) {
  const loaded = state.examples.get(message);
  const box = $(".lead-up", element);
  if (!box || !loaded) return;
  if (!loaded.leadUp) {
    box.innerHTML = `<div class="muted">Loading what led up to the first failure…</div>`;
    try {
      // The window before it (the timeline's first 5,000 events were asked, which a failure
      // deep in it is not among: run 866's lead-up to 205.8 s ended at 32.7 s), a millisecond
      // past it (the bound is exclusive), and without the catalog's declarations (`hit` false:
      // no evaluation, and a timeline's first lines are full of them).
      const { events } = await eventsBefore("seq>=0", example.branch, example.first_vtime_ns, 0.001);
      const declared = (event) => event.event && ((event.event.assert && event.event.assert.hit === false)
        || (event.event.antithesis_assert && event.event.antithesis_assert.hit === false));
      loaded.leadUp = events.filter((event) => event.vtime_ns <= example.first_vtime_ns && !declared(event)).slice(-leadUpLines);
    } catch (error) { loaded.leadUp = { error: error.message }; }
  }
  const now = [...document.querySelectorAll(".property")].find((other) => other.dataset.message === message);
  const target = now ? $(".lead-up", now) : null;
  if (!target) return;
  if (loaded.leadUp.error) { target.innerHTML = `<div class="fail-text">${escape(loaded.leadUp.error)}</div>`; return; }
  // Ours (assert) or Antithesis's SDKs' (antithesis_assert, named by message or id).
  const failingEvent = (event) => {
    const asserted = event.event && (event.event.assert || event.event.antithesis_assert);
    return Boolean(asserted) && (asserted.message || asserted.id) === message && asserted.condition === false;
  };
  const rows = loaded.leadUp.map((event) => {
    const { kind, text, css } = describe(event.event);
    return `<tr class="${failingEvent(event) ? "here" : ""}"><td class="muted">${seconds(event.vtime_ns)}</td>
      <td><span class="kind ${css}">${escape(kind)}</span></td><td>${escape(text)}</td></tr>`;
  }).join("");
  target.innerHTML = `<div class="group-title">Leading up to the first failure (branch ${example.branch}, ${seconds(example.first_vtime_ns)})</div>
    <div class="logs"><table>${rows}</table></div>
    <div style="margin-top:6px"><button class="lead-up-more">View more logs</button></div>`;
  $(".lead-up-more", target).addEventListener("click", (event) => {
    event.stopPropagation();
    logsOpen(example.branch, example.first_vtime_ns);
  });
}

// Shrinking (determinismo shrink, POST /runs/<id>/shrink): the fewest of a failing timeline's
// faults the failure still needs, each candidate judged over the same timelines. A property
// shows the run's latest shrinking of it, running or done.
const shrinks = new Map(); // Property message -> {run, id, of, done, result, progress, error}.
let shrinkTimer = null;
async function shrinkRun(property, branch) {
  const run = state.runId;
  shrinks.set(property, { run, of: { branch, property }, done: false, progress: "starting" });
  shrinkDraw(property);
  try { await apiJson(`/runs/${run}/shrink`, { branch, property }); }
  catch (error) { shrinks.set(property, { run, of: { branch, property }, done: true, error: error.message }); shrinkDraw(property); return; }
  await shrinkRefresh();
}
async function shrinkRefresh() {
  const run = state.runId;
  let list;
  try { list = await apiJson(`/runs/${run}/shrink`); } catch { return; }
  for (const shrink of list) if (shrink.of && shrink.of.property) shrinks.set(shrink.of.property, { ...shrink, run });
  for (const property of shrinks.keys()) shrinkDraw(property);
  clearTimeout(shrinkTimer);
  if (list.some((shrink) => !shrink.done) && run === state.runId) shrinkTimer = setTimeout(shrinkRefresh, 5000);
}
function shrinkDraw(property) {
  const element = document.querySelector(`.property[data-message="${CSS.escape(property)}"] .shrink-result`);
  const shrink = shrinks.get(property);
  if (!element || !shrink || shrink.run !== state.runId) return;
  if (shrink.error) { element.innerHTML = `<div class="fail-text">Shrink: ${escape(shrink.error)}</div>`; return; }
  const result = shrink.result && shrink.result.shrink;
  if (!result) {
    element.innerHTML = `<div class="muted">Shrinking timeline ${shrink.of.branch}${shrink.done ? ": it ended without a result" : "…"} <span class="mono">${escape(shrink.progress || "")}</span></div>`;
    return;
  }
  const of = `of ${result.timelines} timelines`;
  // The whole script failed nowhere: nothing to shrink (more timelines may reproduce it).
  if (result.reproduced === false) {
    element.innerHTML = `<div class="muted">Shrink (timeline ${shrink.of.branch}): its script failed in none ${of}, nothing to shrink; try more timelines.</div>`;
    return;
  }
  element.innerHTML = `<div style="margin:6px 0"><b>Shrunk</b> (timeline ${shrink.of.branch}):
    ${result.kept.length ? `it needs ${result.kept.length} of its ${result.faults} faults: fails in ${result.failing_kept} ${of} with them alone`
      : `it needs none of its ${result.faults} faults: fails in ${result.failing_none} ${of} without any`};
    with all, in ${result.failing_whole}; with none, in ${result.failing_none}. ${result.explorations} explorations.
    ${result.kept.map((fault) => `<div class="mono" style="font-size:12px">${escape(JSON.stringify(fault))}</div>`).join("")}
    <div class="muted mono" style="font-size:12px">${escape(result.script)} (explore --script)</div></div>`;
}

// Explaining (determinismo explain, POST /runs/<id>/explain): which details of a failing
// timeline's last faults the failure needed, each drawn again in the same timeline against a
// control (another draw after the fault, varied as often). A property shows the run's latest
// explanation of it, running or done.
const explains = new Map(); // Property message -> {run, id, of, done, result, progress, error}.
let explainTimer = null;
async function explainRun(property, branch) {
  const run = state.runId;
  explains.set(property, { run, of: { branch, property }, done: false, progress: "starting" });
  explainDraw(property);
  try { await apiJson(`/runs/${run}/explain`, { branch, property }); }
  catch (error) {
    let said = error.message;
    try { const answer = JSON.parse(said); said = answer.detail || answer.error; } catch { /* Not serve's JSON. */ }
    explains.set(property, { run, of: { branch, property }, done: true, error: said });
    explainDraw(property);
    return;
  }
  await explainRefresh();
}
async function explainRefresh() {
  const run = state.runId;
  let list;
  try { list = await apiJson(`/runs/${run}/explain`); } catch { return; }
  for (const explain of list) if (explain.of && explain.of.property) explains.set(explain.of.property, { ...explain, run });
  for (const property of explains.keys()) explainDraw(property);
  clearTimeout(explainTimer);
  if (list.some((explain) => !explain.done) && run === state.runId) explainTimer = setTimeout(explainRefresh, 5000);
}
function explainDraw(property) {
  const element = document.querySelector(`.property[data-message="${CSS.escape(property)}"] .explain-result`);
  const explain = explains.get(property);
  if (!element || !explain || explain.run !== state.runId) return;
  if (explain.error) { element.innerHTML = `<div class="fail-text">Explain: ${escape(explain.error)}</div>`; return; }
  const result = explain.result && explain.result.explain;
  if (!result) {
    element.innerHTML = `<div class="muted">${explain.done ? `Explain (timeline ${explain.of.branch}): it ended without a result` : `<span class="loading"></span> Explaining timeline ${explain.of.branch}`} <span class="mono">${escape(explain.progress || "")}</span></div>`;
    return;
  }
  if (!result.faults.length) {
    element.innerHTML = `<div style="margin:6px 0"><b>Explained</b> (timeline ${explain.of.branch}): fails at ${seconds(result.failure_ns)}
      with ${result.decisions ? "only restores" : "no fault"} decided before it: it needs no fault.</div>`;
    return;
  }
  const drew = (detail) => detail.option !== null && detail.option !== undefined ? detail.option : String(detail.drew);
  element.innerHTML = `<div style="margin:6px 0"><b>Explained</b> (timeline ${explain.of.branch}): fails at ${seconds(result.failure_ns)};
    its last ${result.faults.length} of ${result.faults_kept} faults kept, each detail drawn again ${result.variants} times.
    ${result.faults.map((fault) => `<div style="margin-top:6px">${escape(fault.picked)}, decided at ${seconds(fault.vtime_ns)}:
      ${fault.control ? `the control (${escape(fault.control.draw)}) fails in ${fault.control.failing} of ${fault.control.of}` : "no control"}.
      <table><tr><th>Detail</th><th>Drew</th><th>Fails</th><th>Verdict</th></tr>
      ${fault.removed ? `<tr><td>without it</td><td class="mono">(a restore)</td><td class="mono">${fault.removed.failing} of ${fault.removed.of}</td>
        <td class="${fault.removed.verdict === "needed" ? "fail-text" : ""}">${fault.removed.verdict === "free" ? "not needed" : escape(fault.removed.verdict)}</td></tr>` : ""}
      ${fault.details.map((detail) => `<tr><td class="mono">${escape(detail.draw)}</td><td class="mono">${escape(drew(detail))}</td>
        <td class="mono">${detail.failing} of ${detail.of}</td><td class="${detail.verdict === "needed" ? "fail-text" : ""}">${escape(detail.verdict)}</td></tr>`).join("")}
      </table></div>`).join("")}</div>`;
}

// The run's sampled timelines replayed from their tapes: the same history, or where they parted
// (the last checkpoint both passed, the first differing line), and whether another build
// recorded them.
const replaysProperty = "timelines replay to their recorded history";
function replaysDraw(box, replays) {
  const parted = replays.filter((row) => !row.same).length;
  box.innerHTML = replays.length ? `<table><tr><th>Timeline</th><th>Replay</th><th>Recorded</th><th>Replayed</th><th>Where</th></tr>
    ${replays.slice(0, 40).map((row) => `<tr class="clickable" data-branch="${row.timeline}">
      <td class="mono">${row.timeline}</td><td class="${row.same ? "pass-text" : "fail-text"}">${row.same ? "the same" : "parted"}</td>
      <td class="mono">${escape(row.recorded || "")}</td><td class="mono">${escape(row.replayed || "")}</td>
      <td style="white-space:normal">${escape(row.why || "")}</td></tr>`).join("")}
    </table><div class="muted" style="margin-top:4px">${replays.length} timelines replayed, ${parted} parted. Click one for its logs.</div>`
    : `<div class="muted">No timeline replayed yet.</div>`;
  box.querySelectorAll("tr.clickable").forEach((row) => row.addEventListener("click", () =>
