// Findings: what changed since the previous run of the same system and scenario.
// The run's triage report (infra/host/triage.py: a model's hypotheses, each with a replay that
// confirms or refutes it), markdown rendered: headings, lists, bold, code. Hidden without one.
async function triageLoad() {
  const body = $("#triage-body");
  if (!body) return;
  let text;
  try { text = await api(`/runs/${state.runId}/triage`); } catch { $("#triage")?.remove(); return; }
  const verdicts = (text.match(/\*\*(confirmed|refuted|unconfirmed)\*\*/g) || []).map((v) => v.replaceAll("*", ""));
  const summary = $("#triage .summary");
  if (summary) summary.textContent = ["confirmed", "refuted", "unconfirmed"].filter((v) => verdicts.includes(v))
    .map((v) => `${verdicts.filter((x) => x === v).length} ${v}`).join(", ") || "no verdicts";
  body.classList.remove("muted");
  body.innerHTML = markdownHtml(text);
}

function markdownHtml(text) {
  const inline = (line) => escape(line).replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>");
  const html = [];
  let code = null;
  for (const line of text.split("\n")) {
    if (line.startsWith("```")) {
      if (code === null) code = [];
      else { html.push(`<pre class="output" style="max-height:240px;overflow:auto">${escape(code.join("\n"))}</pre>`); code = null; }
    } else if (code !== null) code.push(line);
    else if (line.startsWith("# ")) continue; // The run's own title: the page has it.
    else if (line.startsWith("## ")) html.push(`<h4 style="margin:14px 0 4px">${inline(line.slice(3))}</h4>`);
    else if (line.startsWith("- ")) html.push(`<div style="margin-left:12px">• ${inline(line.slice(2))}</div>`);
    else if (line.trim()) html.push(`<div class="muted">${inline(line)}</div>`);
  }
  return html.join("");
}

// A finding's history (Antithesis's run history): a tick for each earlier run of the system and
// scenario, oldest first, red where it failed, green where it passed, grey where the run had no
// such property, then this run's; each opens its run.
function historyHtml(history) {
  if (!history || !history.length) return "";
  const tick = (color, title, run) => `<a href="#${run}" class="tick" style="background:${color}" title="${escape(title)}"></a>`;
  return `<span class="history" title="Earlier runs of this system and scenario, oldest first">${history.map((entry) =>
    tick(entry.failing === null ? "var(--line)" : entry.failing ? "var(--fail)" : "var(--pass)",
      `run ${entry.run}: ${entry.failing === null ? "not a property there" : entry.failing ? "failing" : "passing"}`, entry.run)).join("")}</span>`;
}
// Where a run's failing timelines came from, by how each began (its `why`): fresh ones (roots,
// the setup snapshot's) that no choice made, and the tree's returns (Go-Explore's frontier and
// archive, a strategy plugin's, a random moment): failing timelines per CPU-hour of each says
// whether the returns pay (a plugin's are its own choices; raft A/B 2026-11-07). A timeline
// counts once, for any property it failed after it began that the timeline it returned to never
// failed (one already headed for a failure makes its children fail it too, finding nothing:
// jev-wide's run 1360, 69 failing returns, 11 new); failing as the properties judge.
// The timelines failing each property (store.zig's timeline_properties: a timeline's verdict has
// its ancestors' part, so one failing what its parent never failed failed it after it began).
const failedSql = "SELECT DISTINCT timeline AS branch, message AS name FROM timeline_properties WHERE failed_ns IS NOT NULL";
const originNames = {
  root: "Fresh: a root", setup: "Fresh: from the setup snapshot", frontier: "Returned to: the frontier",
  archive: "Returned to: Go-Explore's archive", plugin: "Returned to: the strategy's choice",
  random: "Returned to: a random moment", other: "Other",
};
// What the nodes logged as errors (GET /runs/<id>/logged: store.logged_sql), as templates by
// node, panics first: a system's report of a bug it survived that no property reads (TiDB's
// recovered auto-analyze panic, #64466, was seen only by reading logs). A template's first
// timeline opens its logs at that moment.
async function loggedLoad() {
  const body = $("#logged-body");
  const id = state.runId;
  if (!body) return;
  const known = state.logged && state.logged.runId === id ? state.logged : null;
  if (!known || (state.run.state === "running" && Date.now() - known.at > 60000)) {
    body.textContent = "Reading every node line of the run…";
    try {
      const rows = await apiJson(`/runs/${id}/logged`);
      // New against the system's previous run (the Findings' one): a kind of error it never
      // logged, by node and template.
      let previous = null;
      try {
        const findings = await apiJson(`/runs/${id}/findings`);
        if (findings.previous != null) previous = { id: findings.previous, rows: await apiJson(`/runs/${findings.previous}/logged`) };
      } catch (error) { previous = null; }
      const before = previous ? new Set(previous.rows.map((row) => `${row.node}\u0000${row.template}`)) : null;
      for (const row of rows) row.fresh = before ? !before.has(`${row.node}\u0000${row.template}`) : false;
      state.logged = { runId: id, at: Date.now(), rows, previous: previous && previous.id };
    } catch (error) {
      body.textContent = `Not read: ${error.message}`;
      return;
    }
  }
  if (state.runId !== id || !$("#logged-body")) return;
  const rows = state.logged.rows || [];
  if (!rows.length) {
    $("#logged-body").innerHTML = `<div class="muted">No node logged a panic, fatal, exception, assertion or ERROR line.</div>`;
    return;
  }
  $("#logged-body").innerHTML = `<table class="logged"><tr><th></th><th>Node</th><th>Line (numbers and ids as #)</th><th>Timelines</th><th>Lines</th><th>First</th></tr>
    ${rows.map((row) => `<tr class="clickable" data-branch="${row.first_timeline}" data-vtime="${row.first_vtime_ns}" title="${escape(row.example)}">
      <td><span class="badge ${row.level === "panic" ? "fail" : ""}">${escape(row.level)}</span>${row.fresh ? ` <span class="badge" title="Not logged by this node in run ${state.logged.previous}, the system's previous run">NEW</span>` : ""}</td>
      <td>${escape(row.node)}</td>
      <td class="mono" style="font-size:12px;word-break:break-all">${escape(row.template)}</td>
      <td>${row.timelines}</td><td>${row.lines}</td>
      <td class="mono">#${row.first_timeline} at ${(Number(row.first_vtime_ns) / 1e9).toFixed(1)} s</td></tr>`).join("")}
    </table><div class="muted" style="margin-top:4px">${rows.length} templates${rows.length >= 500 ? " (the first 500)" : ""}${state.logged.previous != null ? `, ${rows.filter((row) => row.fresh).length} new against run ${state.logged.previous}` : ""}. Click one for its first timeline's logs at that moment; hover for a whole line.</div>`;
  $("#logged-body").querySelectorAll("tr.clickable").forEach((row) => row.addEventListener("click", () =>
    logsOpen(Number(row.dataset.branch), Number(row.dataset.vtime))));
}

// The named decisions the timelines drew (each timeline's decisions_announced: its names and
// how often): whether a swarm draw, thread pausing or the injector's choices happen at all, and
// in how many timelines.
// Learned ranges (events.zig ranges_note): each number a system's events carry, the lowest and
// highest any timeline reached and the timeline holding each, as the explorer kept them (its
// behaviors file, written at the run's end). Guidance, not findings: where the tree went for
// unusual values, read to see what drove a run (and what to assert).
async function rangesLoad() {
  const body = $("#ranges-body");
  const id = state.runId;
  if (!body) return;
  let rows;
  try { rows = await apiJson(`/runs/${id}/ranges`); } catch (error) { body.textContent = `Not known (${error.message}).`; return; }
  if (id !== state.runId || !$("#ranges-body")) return;
  const fields = new Map(); // "event field" -> {event, field, low, high}
  for (const row of rows) {
    const match = /^(highest|lowest) "(.*)" (.*)$/.exec(row.label || "");
    if (!match) continue;
    const [, side, event, field] = match;
    const key = `${event} ${field}`;
    const entry = fields.get(key) || { event, field };
    entry[side === "highest" ? "high" : "low"] = { value: side === "highest" ? row.best : -row.best, timeline: row.timeline, timelines: row.timelines };
    fields.set(key, entry);
  }
  if (!fields.size) {
    body.textContent = state.run.state === "running" ? "Written when the run ends." : "None: its events carried no numbers (or the run is from before learned ranges, or ran with --no-ranges).";
    return;
  }
  const cell = (side) => side ? `${escape(String(side.value))} <span class="muted">timeline ${side.timeline}</span>` : "";
  body.classList.remove("muted");
  body.innerHTML = `<table class="runs-index"><tr><th>Event</th><th>Field</th><th>Lowest seen</th><th>Highest seen</th></tr>
    ${[...fields.values()].sort((a, b) => a.event.localeCompare(b.event) || a.field.localeCompare(b.field)).map((f) =>
      `<tr><td class="mono">${escape(f.event)}</td><td class="mono">${escape(f.field)}</td><td>${cell(f.low)}</td><td>${cell(f.high)}</td></tr>`).join("")}</table>`;
}
// How a run explored (docs/PLAN.md): the tree (generations, why each timeline started, what its
// returns were for), the faults (on for how much of the time, each kind's share, what was
// injected) and the draws (each one's share of the timelines from the start). What a person
// reads to judge a run's exploration: a driver never off, a fault kind never injected, returns
// spent on noise.
async function exploredLoad() {
  const body = $("#explored-body");
  const id = state.runId;
  if (!body) return;
  const firedSql = "SELECT coalesce(json_extract_string(event, '$.details.kind'), '?') AS kind, count(*) AS n FROM events WHERE name = 'fault' GROUP BY 1 ORDER BY 2 DESC";
  const [draws, fired] = await Promise.all([drawsLoad(), apiJson(`/runs/${id}/sql?page=1`, { sql: firedSql }).catch(() => [])]);
  if (id !== state.runId || !$("#explored-body")) return;
  const branches = state.run.explored;
  if (!branches.length) { body.textContent = "No timeline yet."; return; }
  const pct = (part, whole) => whole ? `${Math.round(100 * part / whole)}%` : "—";
  const table = (head, rows) => rows.length ? `<table class="runs-index"><tr>${head.map((h) => `<th>${h}</th>`).join("")}</tr>${rows.map((row) => `<tr>${row.map((cell) => `<td>${cell}</td>`).join("")}</tr>`).join("")}</table>` : "";
  const counted = (items) => { const m = new Map(); for (const item of items) if (item) m.set(item, (m.get(item) || 0) + 1); return [...m].sort((a, b) => b[1] - a[1]); };
  // The tree.
  const generations = counted(branches.map((b) => `generation ${b.generation || 0}`)).sort((a, b) => Number(a[0].split(" ")[1]) - Number(b[0].split(" ")[1]));
  const started = (why) => !why ? "the first generation"
    : /^From the setup snapshot while/.test(why) ? "from the start, while a judgment's nodes were made"
    : /^From the setup snapshot/.test(why) ? "from the start again (so the tree does not only deepen)"
    : /^Returned to/.test(why) ? "returned to the newest frontier"
    : /^Go-Explore's archive/.test(why) ? "returned to the archive (the least visited)"
    : /strateg/i.test(why) ? "the strategy's choice" : "other";
  const returnedFor = (why) => {
    // "…just after it first reached <behavior>" (the frontier) or "…just after <behavior>" (the archive).
    const match = /first reached (.*)/.exec(why || "") || /just after (.*)/.exec(why || "");
    if (!match) return null;
    const what = match[1];
    return /^coverage /.test(what) ? "a new line or edge of code" : /^\S+ printed "/.test(what) ? "a new kind of log line"
      : /^(always|sometimes|reachable|unreachable|always_or_unreachable) /.test(what) ? "an assertion's outcome"
      : /^(highest|lowest) "/.test(what) ? "a learned range's extreme" : /^closer to/.test(what) ? "closer to a guidance assertion"
      : /^best "/.test(what) ? "an optimization's best" : "an event";
  };
  const reasons = counted(branches.map((b) => started(b.why)));
  const targets = counted(branches.map((b) => returnedFor(b.why)));
  const returns = targets.reduce((x, [, n]) => x + n, 0);
  // Timelines a generation, as bars: generation 0 starts from the setup snapshot, each later one
  // branches from moments of the timelines before it.
  const byGeneration = generations.map(([g, n]) => [Number(g.split(" ")[1]), n]);
  const laterCounts = counted(byGeneration.slice(1).map(([, n]) => String(n)));
  const usual = laterCounts.length ? Number(laterCounts[0][0]) : null;
  const most = Math.max(1, ...byGeneration.map(([, n]) => n));
  const barWidth = Math.max(3, Math.min(16, Math.floor(640 / Math.max(1, byGeneration.length)) - 2));
  const chartHeight = 56;
  const bars = byGeneration.map(([g, n], i) => {
    const h = Math.max(1, Math.round(chartHeight * n / most));
    return `<rect x="${i * (barWidth + 2)}" y="${chartHeight - h}" width="${barWidth}" height="${h}" fill="var(--accent)"><title>generation ${g}: ${n} timelines</title></rect>`
      + (g % 5 === 0 ? `<text x="${i * (barWidth + 2) + barWidth / 2}" y="${chartHeight + 12}" font-size="10" text-anchor="middle" fill="var(--muted)">${g}</text>` : "");
  }).join("");
  const generationChart = `<svg width="${byGeneration.length * (barWidth + 2)}" height="${chartHeight + 16}" role="img" aria-label="Timelines in each generation" style="display:block;margin:6px 0 2px">${bars}</svg>
    <div class="muted" style="font-size:12px">generation (hover a bar for its count)</div>`;
  let html = `<h4 style="margin:4px 0">The tree</h4>
    <div>${branches.length.toLocaleString()} timelines in ${byGeneration.length} generations. Generation 0 starts from the setup snapshot;
      each later generation branches from moments the timelines before it reached${byGeneration.length > 1
        ? ` (${byGeneration[0][1]} in generation 0${usual != null ? `, ${usual} in most generations after it` : ""})` : ""}.</div>
    ${generationChart}
    ${table(["How each started", "Timelines"], reasons.map(([why, n]) => [escape(why), `${n} (${pct(n, branches.length)})`]))}
    ${returns ? table(["Returns were for", "Timelines"], targets.map(([what, n]) => [escape(what), `${n} (${pct(n, returns)})`])) : ""}`;
  // The faults.
  if (draws && draws.faultTime) {
    let total = 0;
    for (const t of draws.timelines.values()) total += Math.max(0, t.vtime_ns - (t.start_ns || 0));
    const kinds = draws.faultFeatures.filter((f) => /^fault /.test(f) && !/^fault durations /.test(f))
      .map((f) => [f.replace(/^fault /, ""), draws.featureTime.get(f) / draws.faultTime]).sort((a, b) => b[1] - a[1]);

      <div>On for ${pct(draws.faultTime, total)} of the timelines' own virtual time${fired.length ? `; ${fired.reduce((x, row) => x + row.n, 0).toLocaleString()} injected` : ""}.</div>
      ${table(["Kind", "Kept during", "Injected"], kinds.map(([kind, share]) => [escape(kind), `${Math.round(100 * share)}% of fault time`, (injected.get(kind) || 0).toLocaleString()]))}
      ${never.length ? `<div class="warn-text" style="margin-top:4px">Kept but never injected: ${escape(never.join(", "))}.</div>` : ""}`;
  } else {
    html += `<h4 style="margin:14px 0 4px">Faults</h4><div class="muted">No fault regimes recorded: faults off, or a run from before them.</div>`;
  }

  if (draws && draws.drawn.size) {
    const roots = [...draws.drawn.values()];
    const shares = counted(roots.flatMap((set) => [...set])).sort((a, b) => a[0].localeCompare(b[0]));

    html += `<h4 style="margin:14px 0 4px">Draws</h4>

      ${table(["Draw", "Timelines"], shares.map(([name, n]) => [`<span class="mono">${escape(name)}</span>`, `${n} (${pct(n, roots.length)})`]))}

  }

  body.classList.remove("muted");
  body.innerHTML = html;
}

// Causality analysis (causality.zig): the failure's probability at moments of the timeline,

  for (const analysis of analyses) {
    const property = analysis.of && analysis.of.property;

    if (known && known.run === run && known.id > analysis.id) continue;

  for (const property of state.causality.keys()) causalityDraw(property);

  if (analyses.some((analysis) => !analysis.done)) state.causalityTimer = setTimeout(causalityRefresh, 3000);

async function causalityRun(property, branch) {
  const run = state.runId;
  state.causality.set(property, { run, id: Infinity, branch, of: { branch, property }, points: [], done: false, starting: true });
  causalityDraw(property);
  const options = causalityOptions;
  const body = { branch, property, points: Number(options.points), futures: Number(options.futures),

  if (String(options.planner).trim()) body.planner = String(options.planner).trim();
  if (String(options.verdict || "").trim()) body.verdict = String(options.verdict).trim();
  if (String(options.explain_exec || "").trim()) body.explain_exec = String(options.explain_exec).trim();
  try {
    await apiJson(`/runs/${run}/causality`, body);
  } catch (error) {

async function causalityFaults(property, analysis) {
  if (analysis.faults || analysis.faultsLoading || !analysis.of || analysis.of.failure_ms == null) return;
  analysis.faultsLoading = true;
  try {
    analysis.faults = await query({ condition: "event=fault", branch: analysis.branch,
      up_to_vtime: analysis.of.failure_ms / 1000 + 1, limit: 5000 });
  } catch { analysis.faults = []; }
  // The code the timeline first ran (coverage events: each line, edge or block once, the first
  // time a process runs it) inside each jump: the code that decided the bug. A window each (a
  // Kafka timeline with the coverage agent reports 70,000 lines and more).
  const points = [...analysis.points].sort((a, b) => a.vtime_ms - b.vtime_ms);
  analysis.coverage = [];
  for (const jump of causalityJumps(points)) {
    try {
      analysis.coverage.push(...await query({ branch: analysis.branch, limit: 5000,
        condition: `event=coverage vtime>${jump.a.vtime_ms / 1000} vtime<=${jump.b.vtime_ms / 1000}` }));
    } catch { /* none for this window */ }
  }
  causalityDraw(property);
}

    : d.why === "aimed" ? `<div class="t-why"><b>Why this fault</b><br>Aimed: the scenario named the node (sdk.fault_aim: a leader or a primary its drivers found), and half the injector's faults then involve it.</div>`
    : d.why === "aftershock" ? `<div class="t-why"><b>Why this fault</b><br>An aftershock: a power loss again soon after the node started again or wrote data it never synced, what a start's unsynced writes meet.</div>`
    : d.why === "crash_point" ? `<div class="t-why"><b>Why this fault</b><br>A crash point: the node's own code asked to crash here (its state just changed, a field holding its view of the cluster was stored, or a point its program marks), the thread waiting for it.</div>`
    : `<div class="t-why"><b>Why this fault</b><br>Chosen at random from this timeline's seed (a replay chooses the same). A strategy (mutate, the LLM) gives its reasons here.</div>`;
  return `<div class="t-title"><span class="t-dot" style="background:var(--warn);border-radius:2px"></span>Fault: ${escape(kind || "fault")}</div>
    ${kvHtml(pairs)}${kvHtml([["timeline", `#${event.branch} at ${(event.vtime_ns / 1e9).toFixed(3)}s`]])}${why}
    <div class="t-foot">Click for the logs here</div>`;
}
function failureTip(event) {
  const a = event.mark || event.event.assert || event.event.antithesis_assert || {};
  const details = a.details && typeof a.details === "object" ? Object.entries(a.details).slice(0, 8).map(([k, v]) => [k, typeof v === "object" ? JSON.stringify(v) : String(v)]) : [];
  const where = a.location ? `${(a.location.file || "").split("/").pop()}:${a.location.line} ${a.location.function || ""}` : undefined;
  return `<div class="t-title"><span class="t-dot" style="background:var(--fail)"></span>${escape(a.type || "assertion")} failed</div>
    <div>${escape(a.message || "")}</div>${kvHtml(details)}${kvHtml([["where", where], ["timeline", `#${event.branch} at ${(event.vtime_ns / 1e9).toFixed(3)}s`]])}
    <div class="t-foot">The first failure of this timeline · click for the logs here</div>`;
}
// Steered, not drawn at random: a fault the scenario or a strategy asked for, aimed at the node
// the scenario named, the first after a branch point (for the node it named), a crash point's or
// an aftershock; a branch point the explorer returned to for what it found there (its frontier,
// its archive, a strategy), not a random moment or the setup snapshot.
const steeredColor = "#b0399e"; // Magenta: forks keep the accent blue.
function faultSteered(event, decision) {
  const d = event.mark || (event.event && event.event.details) || {};
  return !!(d.injected || decision || (d.why && d.why !== "drawn"));
}
function pointSteered(why) {
  return /^(Returned to|Go-Explore|The strategy returned)/.test(why || "");
}
function branchPointTip(point, why) {
  const stroke = pointSteered(why) ? steeredColor : "#1d1b16";
  return `<div class="t-title"><span class="t-dot" style="background:#fdf6d8;border:1.5px solid ${stroke}"></span>Branch point${pointSteered(why) ? " · steered" : ""}</div>
    <div>${point.count} timelines continue #${point.from} from ${(point.vtime / 1e9).toFixed(3)}s: everything before is shared, each goes on with its own decisions.</div>
    ${why ? `<div class="t-why"><b>Why here</b><br>${escape(why)}</div>` : ""}`;
}

// Multiverse map: boot to the setup snapshot is the trunk; every timeline branches from the
// snapshot (or, for a fork, from its moment of a parent timeline), with its faults and failed
// assertions where they happened, and its own branches right below it. Siblings go by how far
// they (and their branches) ran, shortest first, as Antithesis's multiverse map orders them:
// many short timelines on top, the few long ones below. Runs forked from this run's timelines
// are subtrees, drawn under the timeline they branch from.
async function mapDraw() {
  const body = $("#map-body");
  if (!body || $("#map").classList.contains("closed")) return;
  const run = state.run, info = run.run || {};
  const branches = run.branches.slice().sort((a, b) => a.index - b.index);
  if (!branches.length) { body.textContent = "No timelines yet."; return; }
  // Failure marks (small summaries), fetched again only when timelines finished since.
  let { failures, decisions } = state.mapMarks && state.mapMarks.run === run.id &&
    state.mapMarks.timelines === branches.length ? state.mapMarks : { failures: [], faults: [], decisions: [] };
  if (!(state.mapMarks && state.mapMarks.run === run.id && state.mapMarks.timelines === branches.length)) try {
    // Kept by serve (store's marks), and fetched with the run already.
    failures = run.failures || lines(await api(`/runs/${state.runId}/failures`));
    // A strategy's reasons for its faults: only a run with a strategy has them.
    decisions = info.strategy ? await query({ condition: "event=decision", limit: 20000 }) : [];
    state.mapMarks = { run: run.id, timelines: branches.length, failures, decisions };
  } catch { /* The tree still shows the timelines. */ }
  // Faults, a long run's hundreds of thousands: those of the timelines on screen, loaded as
  // they come into view (kept for the run), thinned to about one mark per pixel.
  if (!state.mapFaults || state.mapFaults.run !== run.id) state.mapFaults = { run: run.id, loaded: new Set(), faults: [] };
  const faults = state.mapFaults.faults;
  // A strategy's reason for a fault: its last decision for the fault injector before it.
  const decisionsOf = new Map();
  for (const d of decisions) {
    if (!decisionsOf.has(d.branch)) decisionsOf.set(d.branch, []);
    decisionsOf.get(d.branch).push(d);
  }
  const decisionFor = (fault) => {
    let found = null;
    for (const d of decisionsOf.get(fault.branch) || []) {
      if (d.vtime_ns > fault.vtime_ns) break;
      if ((d.event.details || {}).source === "det-faults") found = d;
    }
    return found;
  };
  const forkedHere = info.from_branch != null;
  if (!forkedHere) await Promise.all(state.runs.filter((other) => other.from_branch != null && other.id !== run.id).map(runDetails));
  const children = [...details.values()].filter((other) => other.id !== run.id && other.run && !forkedHere
    && other.run.from_branch != null && other.run.inputs === info.inputs && other.run.seed === info.seed
    && other.run.scenario === info.scenario && other.branches.length);
  // The tree explorer's parentage: a timeline's path ends with its parent and the moment it
  // left it. Rows go depth first, each timeline right under its parent: the parent's line is
  // their shared prefix, and the child leaves it where it diverged.
  const byIndex = new Map(branches.map((b) => [b.index, b]));
  const parentOf = (b) => b.path && b.path.length ? b.path[b.path.length - 1] : null;
  const kids = new Map();
  for (const b of branches) {
    const parent = parentOf(b);
    const key = parent && byIndex.has(parent.branch) ? parent.branch : "root";
    if (!kids.has(key)) kids.set(key, []);
    kids.get(key).push(b);
  }
  // How far a timeline and its branches ran: what siblings are ordered by.
  const reach = new Map();
  const reachOf = (b) => {
    if (!reach.has(b.index)) {
      reach.set(b.index, b.vtime_ns); // A cycle (none expected) ends here.
      reach.set(b.index, Math.max(b.vtime_ns, ...(kids.get(b.index) || []).map(reachOf)));
    }
    return reach.get(b.index);
  };
  const shortestFirst = (a, b) => reachOf(a) - reachOf(b) || a.index - b.index;
  const rows = [];
  const place = (branch, parentRow) => {
    rows.push({ branch, parentRow, parent: parentOf(branch) });
    const at = rows.length - 1;
    for (const kid of (kids.get(branch.index) || []).sort(shortestFirst)) place(kid, at);
    for (const child of children.filter((c) => c.run.from_branch === branch.index)) {
      for (const sub of child.branches.slice().sort((a, b) => a.index - b.index)) {
        rows.push({ branch: sub, child, parentRow: at });
      }
    }
  };
  for (const b of (kids.get("root") || []).sort(shortestFirst)) place(b, null);
  const snapshotNs = run.snapshot ? run.snapshot.vtime_ns
    : Math.min(...failures.concat(faults).map((e) => e.vtime_ns), ...branches.map((b) => b.vtime_ns)) * 0.98;
  const rootNs = forkedHere ? info.from_vtime_ms * 1e6 : snapshotNs;
  // A few much longer timelines would squash the rest: the scale ends past most of them (the
  // longer ones are cut at the edge, ›); zooming and panning reach the rest.
  const ends = rows.map((r) => r.branch.vtime_ns).sort((a, b) => a - b);
  const longest = ends[ends.length - 1], typical = ends[Math.floor(0.95 * (ends.length - 1))];
  const endNs = longest - rootNs > 1.6 * (typical - rootNs) ? rootNs + 1.15 * (typical - rootNs) : longest;
  const rowOf = new Map(rows.filter((r) => !r.child).map((r) => [r.branch.index, rows.indexOf(r)]));
  const firstFailures = new Map();
  for (const e of failures) {
    // Its own first failure: what came before its branch point is its ancestors'.
    const branch = byIndex.get(e.branch), parent = branch && parentOf(branch);
    if (parent && e.vtime_ns <= parent.vtime_ns) continue;
    if (!firstFailures.has(e.branch) || firstFailures.get(e.branch).vtime_ns > e.vtime_ns) firstFailures.set(e.branch, e);
  }
  const points = new Map();
  for (const row of rows) if (!row.child && row.parentRow != null) {
    const key = `${row.parentRow}:${row.parent.vtime_ns}`;
    if (!points.has(key)) points.set(key, { row: row.parentRow, vtime: row.parent.vtime_ns, count: 0, from: rows[row.parentRow].branch.index, why: "" });
    const point = points.get(key);
    point.count += 1;
    if (row.branch.why) point.why = row.branch.why;
  }
  const model = { rows, rowOf, faults, firstFailures: [...firstFailures.values()], points: [...points.values()], children,
    decisionFor, forkedHere, info, snapshotNs, rootNs, endNs, longest, depthMax: Math.max(0, ...branches.map((b) => (b.path || []).length)) };
  const full = { t0: rootNs, t1: endNs, r0: 0, r1: rows.length };
  const branched = rows.filter((r) => !r.child && r.parentRow != null).length;
  // Drawn again every 10 s while timelines finish: the map keeps its height meanwhile (emptied,
  // the page was short for a moment and the reader's scroll came back near the top), and a zoom
  // or pan the reader made stays.
  const scrolled = window.scrollY;
  body.style.minHeight = `${body.offsetHeight}px`;
  body.innerHTML = `<div class="muted" style="margin-bottom:6px">${model.depthMax
      ? `Branched up to ${model.depthMax} deep: ${branched} timelines continue another from a moment (◯), sharing everything before it.`
      : info.branching === "flat" ? "Every timeline starts from the setup snapshot (flat branching)."
      : `A tree: its first generation (${info.generation || 16} timelines) starts from the setup snapshot; the next ones branch from the moments it finds.`}</div>
    <div class="legend"><span><i style="background:#6b6455"></i>boot to snapshot</span>
      <span><i style="background:#2e7d32"></i>passing timeline</span><span><i style="background:#b3261e"></i>failing timeline</span>
      <span><i style="background:#a15c00"></i>fault</span><span><i style="background:${steeredColor}"></i>steered fault (asked, aimed, a branch point's, a crash point's, an aftershock)</span>
      <span><i style="background:#b3261e;border-radius:50%"></i>failed assertion</span>
      <span><i style="background:#1d1b16;border-radius:50%"></i>branch point</span><span><i style="background:#fdf6d8;border:2px solid ${steeredColor};border-radius:50%"></i>steered branch point (returned to for what it found)</span>
      <span><i style="background:#1a4f8b"></i>fork (a subtree: another run)</span>
      <span><i style="background:#0e7490;border-radius:50%"></i>search result</span></div>
    <div class="map tree" style="cursor:grab;touch-action:none;position:relative"></div>
    <div class="muted">Hover for details and why; click a timeline (or a mark) for its logs at that moment. Scroll to zoom (time and timelines), drag to pan, double-click to see it all.</div>`;
  const container = body.querySelector(".tree");
  const kept = state.mapView && state.mapView.run === run.id && state.mapView.zoomed ? state.mapView.view : null;
  let view = kept ? { t0: Math.max(full.t0, Math.min(kept.t0, full.t1)), t1: Math.min(full.t1, kept.t1),
    r0: Math.min(kept.r0, full.r1), r1: Math.min(kept.r1, full.r1) } : { ...full };
  if (view.t1 <= view.t0 || view.r1 <= view.r0) view = { ...full };
  const draw = () => {
    const zoomed = view.r0 > 0 || view.r1 < full.r1 || view.t0 > full.t0 || view.t1 < full.t1;
    container.innerHTML = treeSvg(model, view, Math.max(720, body.clientWidth - 4)) +
      (zoomed ? treeMinimap(model, view, full) : "");
  };
  // The row under the pointer: its line outlined, its tooltip shown; a click opens its logs.
  const tip = document.getElementById("tip");
  const rowAt = (event) => {
    const { top, rowHeight, x0, x1, fan } = layout();
    const box = container.getBoundingClientRect();
    const px = event.clientX - box.left, py = event.clientY - box.top;
    if (px < x0 - fan || px > x1 + 4) return null;
    const i = Math.round(view.r0 + (py - top - rowHeight / 2) / rowHeight);
    return i >= 0 && i < rows.length && Math.abs(top + (i - view.r0) * rowHeight + rowHeight / 2 - py) <= Math.max(rowHeight, 4) ? i : null;
  };
  let hovered = null;
  container.addEventListener("mousemove", (event) => {
    if (drag || event.target.closest("[data-tip]")) { if (hovered != null) { hovered = null; const h = container.querySelector(".row-hover"); if (h) h.setAttribute("d", ""); } return; }
    const i = rowAt(event);
    const outline = container.querySelector(".row-hover");
    if (i !== hovered) {
      hovered = i;
      if (outline) outline.setAttribute("d", i != null && model.rowPaths ? model.rowPaths[i] || "" : "");
      if (i == null) { tip.classList.remove("on"); container.style.cursor = "grab"; return; }
      tip.innerHTML = timelineTip(rows[i].branch, rows[i].child && rows[i].child.id);
      container.style.cursor = "pointer";
    }
    if (i != null) {
      tip.classList.add("on"); // The page's tooltips hide it as the pointer crosses elements.
      const pad = 14;
      let left = event.clientX + pad, topPx = event.clientY + pad;
      if (left + tip.offsetWidth > innerWidth - 8) left = event.clientX - tip.offsetWidth - pad;
      if (topPx + tip.offsetHeight > innerHeight - 8) topPx = event.clientY - tip.offsetHeight - pad;
      tip.style.left = Math.max(8, left) + "px";
      tip.style.top = Math.max(8, topPx) + "px";
    }
  });
  container.addEventListener("mouseleave", () => {
    hovered = null;
    tip.classList.remove("on");
    const outline = container.querySelector(".row-hover");
    if (outline) outline.setAttribute("d", "");
  });
  container.addEventListener("click", (event) => {
    if (container.dataset.dragged) return; // A drag's end (the capture phase handler).
    const element = event.target.closest(".mark, .fork");
    if (element) {
      event.stopPropagation();
      if (element.dataset.run) { runOpen(Number(element.dataset.run)); return; }
      logsOpen(Number(element.dataset.branch), Number(element.dataset.vtime));
      return;
    }
    const i = rowAt(event);
    if (i == null) return;
    const row = rows[i];
    if (row.child) { runOpen(row.child.id); return; }
    logsOpen(row.branch.index, row.branch.vtime_ns);
  });
  let loading = false;
  const faultsLoad = async () => {
    if (loading || state.mapFaults.run !== run.id) return;
    const want = [];
    for (let i = Math.max(0, Math.floor(view.r0)); i < Math.min(rows.length, Math.ceil(view.r1)) && want.length < 400; i++) {
      const index = rows[i].branch.index;
      if (!state.mapFaults.loaded.has(index)) want.push(index);
    }
    if (!want.length) return;
    loading = true;
    try {
      const pixel_ns = Math.max(1, Math.floor((view.t1 - view.t0) / Math.max(720, body.clientWidth)));
      // 100 timelines a request (serve answers 100,000 rows at most), drawn as they come.
      for (let at = 0; at < want.length && state.mapFaults.run === run.id; at += 100) {
        const some = want.slice(at, at + 100);
        faults.push(...await faultMarks(some, pixel_ns * 2));
        for (const index of some) state.mapFaults.loaded.add(index);
        drawAll();
      }
    } catch { /* Drawn without them. */ }
    loading = false;
    redraw();
  };
  const drawAll = draw;
  const drawThenLoad = () => { drawAll(); faultsLoad(); };
  drawThenLoad();
  body.style.minHeight = "";
  if (window.scrollY !== scrolled) window.scrollTo(0, scrolled);
  // Zoom and pan change the window of time and timelines shown; the tree is drawn again at
  // its size (not magnified). A drag past a few pixels is not a click.
  const layout = () => treeLayout(model, view, Math.max(720, body.clientWidth - 4));
  let frame = null;
  const redraw = () => {
    state.mapView = { run: run.id, view: { ...view },
      zoomed: view.r0 > 0 || view.r1 < full.r1 || view.t0 > full.t0 || view.t1 < full.t1 };
    if (!frame) frame = requestAnimationFrame(() => { frame = null; drawThenLoad(); });
  };
  container.addEventListener("wheel", (event) => {
    event.preventDefault();
    const { x0, x1, top, rowHeight } = layout();
    const box = container.getBoundingClientRect();
    const factor = Math.exp(event.deltaY * 0.0015);
    const px = Math.min(1, Math.max(0, (event.clientX - box.left - x0) / (x1 - x0)));
    const at = view.t0 + (view.t1 - view.t0) * px;
    const span = Math.min(full.t1 - full.t0, Math.max(1e6, (view.t1 - view.t0) * factor));
    view.t0 = Math.max(full.t0 - span * 0.05, at - span * px);
    view.t1 = view.t0 + span;
    const rowAt = view.r0 + (event.clientY - box.top - top) / rowHeight;
    const rows = Math.min(full.r1, Math.max(6, (view.r1 - view.r0) * factor));
    const py = Math.min(1, Math.max(0, (rowAt - view.r0) / (view.r1 - view.r0)));
    view.r0 = Math.min(Math.max(0, rowAt - rows * py), full.r1 - rows);
    view.r1 = view.r0 + rows;
    redraw();
  }, { passive: false });
  let drag = null;
  // The minimap: a click or a drag there centers the view on that place of the whole tree.
  let minimapDrag = false;
  const minimapGo = (event) => {
    const minimap = container.querySelector(".minimap");
    if (!minimap) return;
    const box = minimap.getBoundingClientRect(), pad = 4;
    const fx = Math.min(1, Math.max(0, (event.clientX - box.left - pad) / (box.width - 2 * pad)));
    const fy = Math.min(1, Math.max(0, (event.clientY - box.top - pad) / (box.height - 2 * pad)));
    const spanT = view.t1 - view.t0, spanR = view.r1 - view.r0;
    const at = full.t0 + (full.t1 - full.t0) * fx, rowAt = full.r1 * fy;
    view.t0 = Math.min(Math.max(full.t0, at - spanT / 2), full.t1 - spanT);
    view.t1 = view.t0 + spanT;
    view.r0 = Math.min(Math.max(0, rowAt - spanR / 2), full.r1 - spanR);
    view.r1 = view.r0 + spanR;
    redraw();
  };
  container.addEventListener("pointerdown", (event) => {
    if (event.target.closest(".minimap")) {
      event.stopPropagation();
      minimapDrag = true;
      container.setPointerCapture(event.pointerId);
      minimapGo(event);
      return;
    }
    drag = { x: event.clientX, y: event.clientY, view: { ...view }, moved: false };
  });
  container.addEventListener("pointermove", (event) => {
    if (minimapDrag) { minimapGo(event); return; }
    if (!drag) return;
    const dx = event.clientX - drag.x, dy = event.clientY - drag.y;
    if (!drag.moved && Math.hypot(dx, dy) < 4) return;
    if (!drag.moved) { container.setPointerCapture(event.pointerId); container.style.cursor = "grabbing"; drag.moved = true; }
    const { x0, x1, rowHeight } = layout();
    const dt = -dx * (drag.view.t1 - drag.view.t0) / (x1 - x0);
    const dr = Math.min(Math.max(-drag.view.r0, -dy / rowHeight), full.r1 - drag.view.r1);
    view = { t0: drag.view.t0 + dt, t1: drag.view.t1 + dt, r0: drag.view.r0 + dr, r1: drag.view.r1 + dr };
    redraw();
  });
  const release = () => {
    if (minimapDrag) { minimapDrag = false; container.dataset.dragged = "1"; return; }
    if (drag && drag.moved) container.dataset.dragged = "1";
    drag = null;
    container.style.cursor = "grab";
  };
  container.addEventListener("pointerup", release);
  container.addEventListener("pointercancel", release);
  container.addEventListener("click", (event) => {
    if (container.dataset.dragged) { delete container.dataset.dragged; event.stopPropagation(); event.preventDefault(); }
  }, true);
  container.addEventListener("dblclick", () => { view = { ...full }; redraw(); });
}

// The whole tree in small, with the part shown boxed: for finding one's way in big runs.
function treeMinimap(model, view, full) {
  const w = 220, h = 110, pad = 4;
  const x = (ns) => pad + (w - 2 * pad) * (ns - full.t0) / Math.max(1, full.t1 - full.t0);
  const y = (i) => pad + (h - 2 * pad) * (i + 0.5) / Math.max(1, full.r1);
  const lines = model.rows.map((row, i) => {
    const b = row.branch, start = row.parent ? row.parent.vtime_ns : model.rootNs;
    const color = b.failing && b.failing.length ? "var(--fail)" : "var(--pass)";
    return `<line x1="${x(start)}" x2="${Math.max(x(start) + 1, x(b.vtime_ns))}" y1="${y(i)}" y2="${y(i)}" stroke="${color}" stroke-opacity=".7" stroke-width="1"/>`;
  }).join("");
  const vx0 = x(Math.max(full.t0, view.t0)), vx1 = x(Math.min(full.t1, view.t1));
  const vy0 = pad + (h - 2 * pad) * view.r0 / full.r1, vy1 = pad + (h - 2 * pad) * view.r1 / full.r1;
  return `<svg class="minimap" width="${w}" height="${h}" style="position:absolute;right:8px;top:8px;background:var(--panel);border:1px solid var(--line);border-radius:6px;cursor:crosshair" ${tipAttr("<div class=\"t-title\">The whole tree</div>The box is what is shown. Click or drag here to move it; double-click the tree to see it all.")}>
    ${lines}<rect x="${vx0}" y="${vy0}" width="${Math.max(3, vx1 - vx0)}" height="${Math.max(3, vy1 - vy0)}" fill="rgba(143,124,247,.18)" stroke="var(--accent)" stroke-width="1.5"/></svg>`;
}

// Where things go for a window of the tree: time t0..t1 across, timelines r0..r1 down.
function treeLayout(model, view, width) {
  // The plot keeps the height it has with every timeline shown: zooming spreads fewer rows over it.
  const visible = view.r1 - view.r0;
  const plot = Math.max(3, Math.min(14, 760 / model.rows.length)) * model.rows.length;
  const rowHeight = Math.max(plot, 160) / visible;
  const top = 34, height = top + Math.max(plot, 160) + 34;
  const snapshotX = 150, fan = Math.min(70, 8 + visible * 1.5);
  const rootX = model.forkedHere ? snapshotX + 110 : snapshotX;
  const x0 = rootX + fan, x1 = width - 46;
  return { rowHeight, top, height, snapshotX, rootX, fan, x0, x1, width };
}

function treeSvg(model, view, width) {
  const { rows, rowOf, info, forkedHere, snapshotNs, rootNs } = model;
  const { rowHeight, top, height, snapshotX, rootX, fan, x0, x1 } = treeLayout(model, view, width);
  const x = (ns) => x0 + (x1 - x0) * (ns - view.t0) / Math.max(1, view.t1 - view.t0);
  const y = (i) => top + (i - view.r0) * rowHeight + rowHeight / 2;
  const shown = (i) => i >= view.r0 - 1 && i <= view.r1;
  const inTime = (ns) => ns >= view.t0 && ns <= view.t1;
  const whole = view.r0 === 0 && view.r1 === rows.length && view.t0 <= rootNs;
  // The snapshot (the fan's root): at its place in time, or at the left edge when out of view.
  const rootPoint = { x: whole ? rootX : Math.max(x0 - fan, Math.min(x(rootNs), x1)), y: y((rows.length - 1) / 2) };
  const stroke = Math.max(1, Math.min(1.8, rowHeight / 5));
  // Every timeline's line in one path per color (thousands of elements made big runs' pages
  // busy redrawing them); the pointer finds its row (mapDraw), and model.rowPaths outlines it.
  const paths = { pass: [], fail: [], fork: [] };
  const rowPaths = [];
  rows.forEach((row, i) => {
    if (!shown(i) && !(row.parentRow != null && shown(row.parentRow))) return;
    const b = row.branch, yy = y(i), end = Math.min(x1, x(b.vtime_ns));
    let d, kind = b.failing.length ? "fail" : "pass";
    if (row.child) {
      const fx = x(row.child.run.from_vtime_ms * 1e6), fy = y(row.parentRow);
      d = `M${fx},${fy} C${fx + 24},${fy} ${fx + 16},${yy} ${fx + 40},${yy} L${Math.max(fx + 40, end)},${yy}`;
      kind = "fork";
    } else if (row.parentRow != null) {
      // Left its parent's line at the moment it diverged: everything before is shared.
      const fx = x(row.parent.vtime_ns), fy = y(row.parentRow);
      d = `M${fx},${fy} C${fx + 18},${fy} ${fx + 10},${yy} ${fx + 30},${yy} L${Math.max(fx + 30, end)},${yy}`;
    } else {
      const start = whole ? x0 : Math.max(x0, x(rootNs) + fan);
      d = `M${rootPoint.x},${rootPoint.y} C${rootPoint.x + fan * 0.6},${rootPoint.y} ${start - fan * 0.4},${yy} ${start},${yy} L${Math.max(start, end)},${yy}`;
    }
    paths[kind].push(d);
    rowPaths[i] = d;
  });
  model.rowPaths = rowPaths;
  const lines = `<path d="${paths.pass.join("")}" fill="none" stroke="#2e7d32" stroke-opacity=".65" stroke-width="${stroke}"/>
    <path d="${paths.fail.join("")}" fill="none" stroke="#b3261e" stroke-opacity=".75" stroke-width="${stroke}"/>
    <path d="${paths.fork.join("")}" fill="none" stroke="#1a4f8b" stroke-opacity=".75" stroke-width="${stroke}"/>
    <path class="row-hover" d="" fill="none" stroke="#1d1b16" stroke-width="${stroke + 1}" pointer-events="none"/>`;
  const size = Math.max(3, Math.min(10, rowHeight * 0.75));
  // One mark per few pixels of a row and kind: marks that would overlap are not told apart, and
  // big runs have tens of thousands.
  const drawn = new Set();
  // The marks shown, then drawn: each its own element (a tooltip, a click) up to marks_max, in
  // one path per kind beyond (zooming in brings their details back).
  const marks = [];
  const mark = (e, kind) => {
    const row = rowOf.get(e.branch);
    if (row === undefined || !shown(row) || !inTime(e.vtime_ns)) return;
    // Before its branch point, an event is its ancestors': drawn on their lines.
    const parent = rows[row].parent;
    if (parent && e.vtime_ns <= parent.vtime_ns) return;
    const xx = x(e.vtime_ns), yy = y(row);
    const bucket = `${kind}:${row}:${Math.round(xx / 3)}`;
    if (drawn.has(bucket)) return;
    drawn.add(bucket);
    marks.push({ e, kind, xx, yy });
  };
  for (const e of model.faults) mark(e, "fault");
  for (const e of model.firstFailures) mark(e, "failure");
  // The last search's matches (searchWire), as Antithesis's map marks them: on top, the
  // faults faded while a search is shown.
  const found = state.mapSearch && state.run && state.mapSearch.run === state.run.id ? state.mapSearch.marks : [];
  const searched = [];
  for (const e of found) {
    const row = rowOf.get(e.branch);
    if (row === undefined || !shown(row) || !inTime(e.vtime_ns)) continue;
    const parent = rows[row].parent;
    if (parent && e.vtime_ns <= parent.vtime_ns) continue;
    searched.push({ e, xx: x(e.vtime_ns), yy: y(row) });
  }
  const searchHtml = searched.slice(0, 5000).map(({ e, xx, yy }) =>
    `<circle class="mark" data-branch="${e.branch}" data-vtime="${e.vtime_ns}" cx="${xx}" cy="${yy}" r="${Math.max(3.5, Math.min(6, rowHeight))}" fill="#0e7490" stroke="#fdf6d8" stroke-width="1" style="cursor:pointer" ${tipAttr(`<div class="t-title"><span class="t-dot" style="background:#0e7490"></span>Search result</div>#${e.branch} at ${seconds(e.vtime_ns)}<div class="t-foot">Click for its logs</div>`)}></circle>`).join("");
  const marks_max = 2000;
  const markHtml = marks.length <= marks_max
    ? marks.map(({ e, kind, xx, yy }) => kind === "fault"
      ? `<rect class="mark" data-branch="${e.branch}" data-vtime="${e.vtime_ns}" x="${xx - 1.25}" y="${yy - size / 2}" width="2.5" height="${size}" fill="${faultSteered(e, model.decisionFor(e)) ? steeredColor : "#a15c00"}" style="cursor:pointer" ${tipAttr(faultTip(e, model.decisionFor(e)))}></rect>`
      : `<circle class="mark" data-branch="${e.branch}" data-vtime="${e.vtime_ns}" cx="${xx}" cy="${yy}" r="${Math.max(2.5, size / 2)}" fill="#b3261e" style="cursor:pointer" ${tipAttr(failureTip(e))}></circle>`).join("")
    : `<path d="${marks.filter((m) => m.kind === "fault" && !faultSteered(m.e, model.decisionFor(m.e))).map(({ xx, yy }) => `M${xx},${yy - size / 2}v${size}`).join("")}" stroke="#a15c00" stroke-width="2.5"/>
      <path d="${marks.filter((m) => m.kind === "fault" && faultSteered(m.e, model.decisionFor(m.e))).map(({ xx, yy }) => `M${xx},${yy - size / 2}v${size}`).join("")}" stroke="${steeredColor}" stroke-width="2.5"/>
      <path d="${marks.filter((m) => m.kind === "failure").map(({ xx, yy }) => `M${xx - 2},${yy}h4`).join("")}" stroke="#b3261e" stroke-width="${Math.max(2.5, size / 2)}" stroke-linecap="round"/>`;
  const branchPoints = model.points.filter((p) => shown(p.row) && inTime(p.vtime)).map((point) =>
    `<circle cx="${x(point.vtime)}" cy="${y(point.row)}" r="${Math.max(3, Math.min(6, rowHeight / 2))}" fill="#fdf6d8" stroke="${pointSteered(point.why) ? steeredColor : "#1d1b16"}" stroke-width="${pointSteered(point.why) ? 2 : 1.5}" ${tipAttr(branchPointTip(point, point.why))}></circle>`).join("");
  const forkPoints = model.children.map((child) => {
    const row = rowOf.get(child.run.from_branch) ?? 0, at = child.run.from_vtime_ms * 1e6;
    if (!shown(row) || !inTime(at)) return "";
    const fx = x(at), fy = y(row);
    const forkTip = `<div class="t-title"><span class="t-dot" style="background:var(--accent)"></span>Fork · run ${child.id}</div>
      <div>${child.branches.length} timelines from #${child.run.from_branch} at ${child.run.from_vtime_ms} ms, explored as their own run.</div>
      <div class="t-why"><b>Why here</b><br>Someone forked this moment (from the logs, the API or MCP).</div><div class="t-foot">Click to open the run</div>`;
    return `<g class="fork" data-run="${child.id}" style="cursor:pointer" ${tipAttr(forkTip)}><circle cx="${fx}" cy="${fy}" r="5" fill="#1a4f8b"/>
      <text x="${fx - 8}" y="${fy - 7}" fill="#1a4f8b" font-size="10.5" text-anchor="end">run ${child.id} · #${child.run.from_branch} at ${(at / 1e9).toFixed(2)}s</text></g>`;
  }).join("");
  const cut = rows.map((row, i) => shown(i) && row.branch.vtime_ns > view.t1 && x(row.branch.vtime_ns) > x1
    ? `<text x="${x1 + 1}" y="${y(i) + 3.5}" fill="#6b6455" font-size="11">›</text>` : "").join("");
  const labelEvery = Math.ceil(12 / rowHeight);
  const labels = rows.map((row, i) => !row.child && shown(i) && i % labelEvery === 0
    ? `<text x="${x1 + 10}" y="${y(i) + 3.5}" fill="#6b6455" font-size="10" font-family="var(--mono)">#${row.branch.index}</text>` : "").join("");
  const ticks = Array.from({ length: 6 }, (_, i) => view.t0 + (view.t1 - view.t0) * i / 5).map((ns) =>
    `<text x="${x(ns)}" y="${height - 8}" fill="#6b6455" font-size="10.5" text-anchor="middle">${(ns / 1e9).toFixed(view.t1 - view.t0 < 1e9 ? 3 : 2)}s</text>`).join("");
  const trunk = !whole ? "" : `<line x1="16" y1="${rootPoint.y}" x2="${snapshotX}" y2="${rootPoint.y}" stroke="#6b6455" stroke-width="3"/>
    <text x="16" y="${rootPoint.y - 9}" fill="#6b6455" font-size="10.5">boot · 0s</text>
    ${forkedHere ? `<line x1="${snapshotX}" y1="${rootPoint.y}" x2="${rootX}" y2="${rootPoint.y}" stroke="#1a4f8b" stroke-width="3"/>
      <text x="${(snapshotX + rootX) / 2}" y="${rootPoint.y - 9}" fill="#1a4f8b" font-size="10.5" text-anchor="middle">#${info.from_branch}</text>
      <circle cx="${rootX}" cy="${rootPoint.y}" r="6" fill="#1a4f8b"/>
      <text x="${rootX}" y="${rootPoint.y + 22}" fill="#1a4f8b" font-size="11" text-anchor="middle">fork · ${(info.from_vtime_ms / 1000).toFixed(2)}s</text>` : ""}
    <circle cx="${snapshotX}" cy="${rootPoint.y}" r="7" fill="#fdf6d8" stroke="#1d1b16" stroke-width="2.5" ${tipAttr(`<div class="t-title">The setup snapshot</div>The system booted and is ready (setup_complete) at ${(snapshotNs / 1e9).toFixed(3)}s. Every timeline starts here, or from a moment of one that did.`)}></circle>
    <text x="${snapshotX}" y="${rootPoint.y + (forkedHere ? -14 : 24)}" fill="#1d1b16" font-size="11" text-anchor="middle">setup snapshot</text>
    ${forkedHere ? "" : `<text x="${snapshotX}" y="${rootPoint.y + 38}" fill="#6b6455" font-size="10.5" text-anchor="middle">${(snapshotNs / 1e9).toFixed(2)}s</text>`}`;
  const zoomed = whole ? "" : `<text x="${x0 - fan}" y="16" fill="#6b6455" font-size="10.5">zoomed: ${(view.t0 / 1e9).toFixed(3)}s to ${(view.t1 / 1e9).toFixed(3)}s · timelines ${Math.round(view.r0) + 1} to ${Math.round(view.r1)} of ${rows.length}</text>`;
  return `<svg width="${width}" height="${height}"><defs><clipPath id="tree-clip"><rect x="${x0 - fan}" y="0" width="${x1 - x0 + fan + 2}" height="${height}"/></clipPath></defs>
    ${trunk}${zoomed}<g clip-path="url(#tree-clip)">${lines}<g opacity="${searched.length ? 0.3 : 1}">${markHtml}</g>${branchPoints}${forkPoints}${searchHtml}</g>${cut}${labels}${ticks}</svg>`;
}

// Search: conditions and temporal conditions over every timeline (src/query.zig).
function searchBody() {
  return `<div class="search-form">
    <input id="q-condition" placeholder='Condition, e.g. assert.condition=false   or   output.text~"connection refused"   or   event=fault details.kind=partition'>
    <div class="temporal"><select id="q-temporal"><option value="">no temporal condition</option>
        <option value="preceded_by">preceded by</option><option value="not_preceded_by">not preceded by</option>
        <option value="followed_by">followed by</option><option value="not_followed_by">not followed by</option></select>
      <input id="q-temporal-condition" placeholder="event=fault"><input id="q-within" placeholder="within (s)" type="number" step="any"></div>
    <div class="actions"><select id="q-output"><option value="events">events</option><option value="branches">timelines</option><option value="count">count</option></select>
      <button class="primary" id="q-run">Search</button><span class="muted" id="q-status"></span></div>
    <div id="q-results"></div></div>`;
}
function searchWire() {
  const button = $("#q-run");
  if (!button) return;
  const run = async () => {
    const request = { condition: $("#q-condition").value.trim(), output: $("#q-output").value, limit: 500 };
    if (!request.condition) return;
    const temporal = $("#q-temporal").value, other = $("#q-temporal-condition").value.trim();
    if (temporal && other) request[temporal] = other;
    if ($("#q-within").value) request.within = Number($("#q-within").value);
    $("#q-status").textContent = "Searching…";
    try {
      const results = await query(request);
      $("#q-status").textContent = "";
      $("#q-results").innerHTML = resultsHtml(request.output, results);
      $("#q-results").querySelectorAll("tr.clickable").forEach((row) => row.addEventListener("click", () =>
        logsOpen(Number(row.dataset.branch), Number(row.dataset.vtime))));
      // Every match as a dot on the map (thinned to a few pixels each, as the faults are).
      const marks = await query({ ...request, output: "marks", bucket_ns: 1e8, limit: 200000 });
      state.mapSearch = { run: state.run.id, marks };
      mapDraw();
    } catch (error) { $("#q-status").innerHTML = `<span class="fail-text">${escape(error.message)}</span>`; }
  };
  button.addEventListener("click", run);
  $("#q-condition").addEventListener("keydown", (event) => { if (event.key === "Enter") run(); });
}
function resultsHtml(output, results) {
  if (output === "count") {
    const count = results[0] || { events: 0, branches: 0, timelines: 0 };
    return `<p>${count.events} events in ${count.branches} of ${count.timelines} timelines</p>`;
  }
  if (!results.length) return `<p class="muted">Nothing matched.</p>`;
  if (output === "branches") {
    return `<table><tr><th>Branch</th><th>Matches</th><th>First at</th></tr>${results.map((r) =>
      `<tr class="clickable" data-branch="${r.branch}" data-vtime="${r.first_vtime_ns}"><td class="mono">${r.branch}</td>
       <td class="mono">${r.matches}</td><td class="mono">${seconds(r.first_vtime_ns)}</td></tr>`).join("")}</table>`;
  }
  return `<table><tr><th>Branch</th><th>Time</th><th>Event</th></tr>${results.map((r) => {
    const { kind, text, css } = describe(r.event);
    return `<tr class="clickable" data-branch="${r.branch}" data-vtime="${r.vtime_ns}"><td class="mono">${r.branch}</td>
      <td class="mono">${seconds(r.vtime_ns)}</td><td><span class="kind ${css}">${escape(kind)}</span> <span class="mono">${escape(text)}</span></td></tr>`;
  }).join("")}</table>`;
}

// Logs: a timeline's events up to a moment, and what to do there.
// Only the Logs section changes: what is expanded elsewhere (examples, search) stays.
// A timeline's logs at its end, from a link.
function timelineOpen(branch) {
  const record = state.run && state.run.branches.find((b) => b.index === branch);
  if (record) logsOpen(branch, record.vtime_ns);
}
async function logsOpen(branch, vtime_ns) {
  const card = state.logs && state.logs.branch === branch ? state.logs.card : null;
  state.logs = { branch, vtime_ns, events: null, filter: "", card };
  state.open.add("logs");
  if (state.view !== "explorer") { state.view = "explorer"; render(); }
  // The address names the timeline (a link to send), replaced: no step in the history.
  const here = `#${state.runId}/explorer/${branch}`;
  if (location.hash !== here) history.replaceState(null, "", here);
  const section = $("#logs");
  section.classList.remove("closed");
  $(".summary", section).textContent = logsSummary();
  $(".body", section).innerHTML = logsBody();
  section.scrollIntoView({ behavior: "smooth" });
  if (!card) timelineCardLoad(branch);
  await logsLoad();
}

// How a timeline was set up (docs/PLAN.md): why the tree made it, what it drew (drivers, knobs),
// its fault swarm and regime, the faults that fired; a few lines, the rest on demand. From its
// whole history: a branch's draws were made in its ancestors, before its branch point.
async function timelineCardLoad(branch) {
  const logs = state.logs;
  let events;
  try {
    events = await query({ condition: "event=fault_swarm or event=fault_regime or event=node_knob or event=command_start or event=fault or event=interleaved",
      branch, limit: 20000 });
  } catch (error) { events = null; logs.cardError = error.message; }
  if (state.logs !== logs) return;
  const record = state.run.branches.find((b) => b.index === branch);
  logs.card = timelineCardHtml(branch, record, events || []);
  const card = $("#timeline-card");
  if (card) {
    card.outerHTML = logs.card;
    const placed = $("#timeline-card");
    if (placed) placed.addEventListener("toggle", () => { state.cardOpen = placed.open; });
  }
}
function timelineCardHtml(branch, record, events) {
  const named = (name) => events.filter((e) => e.event && e.event.event === name).map((e) => ({ ...e.event.details, vtime_ns: e.vtime_ns }));
  const commands = [...new Set(named("command_start").map((d) => d.name).filter(Boolean))];
  // Each knob's choice per node (its last), "mixed" when the nodes differ.
  const knobs = new Map();
  for (const d of named("node_knob")) {
    const value = d.env ? String(d.env).split("=").pop() : String(d.choice);
    if (!knobs.has(d.knob)) knobs.set(d.knob, new Map());
    knobs.get(d.knob).set(d.node, value);
  }
  const knobText = [...knobs].map(([knob, nodes]) => {
    const values = [...new Set(nodes.values())];
    return values.length === 1 ? `${knob}=${values[0]}` : `${knob}: ${[...nodes].map(([node, value]) => `${node}=${value}`).join(", ")}`;
  });
  const swarms = named("fault_swarm");
  const swarm = swarms[swarms.length - 1];
  const kinds = swarm && swarm.kinds ? String(swarm.kinds).split(/\s+/).filter(Boolean).map((pair) => pair.split(":"))
    .sort((a, b) => Number(b[1]) - Number(a[1])) : [];
  const regimes = named("fault_regime");
  const regime = regimes[regimes.length - 1];
  const fired = new Map();
  for (const d of named("fault")) {
    const kind = [d.kind, d.flavor].filter(Boolean).join(" · ");
    fired.set(kind, (fired.get(kind) || 0) + 1);
  }
  const firedText = [...fired].sort((a, b) => b[1] - a[1]).map(([kind, count]) => `${kind} ×${count}`);
  const interleaved = named("interleaved");
  const parent = record && (record.path || []).length ? record.path[record.path.length - 1] : null;
  const failing = record ? record.failing || [] : [];
  const shown = (items, count) => items.length > count ? `${items.slice(0, count).join(", ")}, +${items.length - count} more` : items.join(", ");
  const row = (label, html) => html ? `<div class="tl-row"><span class="tl-label">${label}</span><span>${html}</span></div>` : "";
  const why = record && record.why ? escape(record.why)
    : parent ? "" : "From the setup snapshot: the first generation (or a flat exploration).";
  return `<details id="timeline-card" class="tl-card"${state.cardOpen ? " open" : ""}>
    <summary class="tl-head">How timeline #${branch} was set up${record && record.generation ? ` · generation ${record.generation}` : ""}${record ? ` · ended ${escape(record.outcome || "")} at ${seconds(record.vtime_ns)}` : ""}
      ${failing.length ? `<span class="fail-text"> · ✗ ${failing.map(escape).join(", ")}</span>` : record ? `<span class="pass-text"> · ✓ every property passes</span>` : ""}</summary>
    ${row("Why", (parent ? `branched from <a href="#" data-card-branch="${parent.branch}" data-card-vtime="${parent.vtime_ns}">#${parent.branch}</a> at ${seconds(parent.vtime_ns)}. ` : "") + why)}
    ${row("Drew", [commands.length ? `commands ${escape(shown(commands, 6))}` : "", knobText.length ? `knobs ${escape(shown(knobText, 4))}` : ""].filter(Boolean).join("; "))}
    ${row("Faults", swarm ? `${escape(shown(kinds.map(([kind, weight]) => `${kind} ${weight}`), 6))} (weights 1 to 64${swarms.length > 1 ? `; redrawn ${swarms.length - 1}×` : ""})`
      + (regime ? `; regime: a fault every ${regime.gap_mean_ms} ms on average, each up to ${regime.duration_max_ms} ms, for ${(regime.stretch_ms / 1000).toFixed(0)} s${regimes.length > 1 ? ` (${regimes.length} regimes)` : ""}` : "")
      : "no fault swarm: faults off, or a run before swarms")}
    ${row("Fired", firedText.length || interleaved.length ? escape([shown(firedText, 6), interleaved.length ? `scheduler choices drawn ${interleaved.length}×` : ""].filter(Boolean).join("; ")) : "no faults")}
    <details class="tl-more"><summary>Every draw</summary>
      ${row("Commands", escape(commands.join(", ")))}${row("Knobs", escape(knobText.join("; ")))}
      ${row("Fault kinds", escape(kinds.map(([kind, weight]) => `${kind} ${weight}`).join(", ")))}
      ${row("Faults fired", escape(firedText.join(", ")))}
      ${regimes.map((r, i) => row(`Regime ${i + 1}`, escape(`from ${seconds(r.vtime_ns)}: every ${r.gap_mean_ms} ms on average, up to ${r.duration_max_ms} ms each, ${(r.stretch_ms / 1000).toFixed(0)} s`))).join("")}
      <div class="muted" style="margin-top:4px">What these mean: <a href="/learn#swarm">swarm testing</a>, <a href="/learn#faults">faults</a>, <a href="/learn#tree">the tree</a>.</div>
    </details>
    ${state.logs && state.logs.cardError ? `<div class="fail-text">${escape(state.logs.cardError)}</div>` : ""}
  </details>`;
}
function logsSummary() {
  return state.logs ? `branch ${state.logs.branch} up to ${seconds(state.logs.vtime_ns)}`
    : "pick an example, a search result or a timeline";
}
const logsLimit = 5000;
const logsWindows = [30, 3, 0.3]; // Seconds of virtual time before the moment, widest first.
// A timeline's events from up to 30 s of virtual time before a moment (narrower when that holds
// more than the limit before reaching it) to `after_s` past it, and where they start.
async function eventsBefore(condition, branch, vtime_ns, after_s) {
  let events = [];
  let from_ns = 0;
  for (const seconds of logsWindows) {
    from_ns = Math.max(0, vtime_ns - seconds * 1e9);
    events = await query({ condition: `${condition} vtime>=${from_ns / 1e9}`, branch,
      up_to_vtime: vtime_ns / 1e9 + after_s, limit: logsLimit });
    if (events.length < logsLimit || events[events.length - 1].vtime_ns >= vtime_ns) break;
  }
  return { events, from_ns };
}
async function logsLoad() {
  const logs = state.logs;
  const condition = logs.filter || "seq>=0";
  try {
    // A tree explorer's timeline begins inside its ancestors (queries give its whole history):
    // each event before its last branch point is marked with the ancestor it shares, and each
    // branch point with a divider.
    const record = state.run.branches.find((b) => b.index === logs.branch);
    const path = (record && record.path) || [];
    // The events around the moment: from up to 30 s of virtual time before it (narrower when
    // that holds more than the limit before reaching it) to 2 s past it. The first 5,000 of the
    // timeline were shown, which a moment deep in it was never among (run 866: 48 s in, the
    // view ended at 17 s).
    const around = await eventsBefore(condition, logs.branch, logs.vtime_ns, 2);
    const events = around.events;
    logs.from_ns = around.from_ns;
    const marked = [];
    let step = 0;
    while (step < path.length && path[step].vtime_ns < logs.from_ns) step += 1; // Before the window.
    for (const event of events) {
      while (step < path.length && event.vtime_ns > path[step].vtime_ns) {

// Notebook --------------------------------------------------------------------------------
// Clojure cells, evaluated in order by babashka on the server (serve.zig, notebook.clj), as
// Antithesis's notebook: what a cell defines, later cells use. Built-ins: run, query, events,
// md, and actions, which run only when clicked here: replay, stacks, profile, extract; an
// action's result (result action) is there for later cells once it ran.
const cellSeparator = "\n;; %%\n";
const notebookTemplate = [
  '(md "# Run notes\\nWhat failed, where, and what the system looked like there.")',
  '(def failures (query "assert.condition=false" {:limit 20}))\nfailures',
  '(def first-failure (first failures))\n(def nodes (map :name (-> run :run :system :nodes)))\n' +
    '(if first-failure\n  (println "first failure: branch" (:branch first-failure) "at" (/ (:vtime_ns first-failure) 1e9) "s")\n  (println "no failures"))\n' +
    '(frequencies (map #(get-in % [:event :assert :message]) failures))',
  '(when (and first-failure (seq nodes))\n  (stacks {:branch (:branch first-failure) :at_vtime_ms (quot (:vtime_ns first-failure) 1000000) :node (first nodes)}))',
].join(cellSeparator);

async function notebookOpen() {
  if (!state.notebook || state.notebook.runId !== state.runId) {
    let source = null;
    try { source = (await apiJson(`/runs/${state.runId}/notebook`)).source; } catch { /* none yet */ }
    state.notebook = { runId: state.runId, cells: (source || notebookTemplate).split(cellSeparator),
      results: new Map(), cache: new Map(), saved: source !== null, timer: null, generation: 0 };
  }
  notebookDraw();
  notebookEvaluate();
}

function notebookDraw() {
  const book = state.notebook;
  $("#notebook").innerHTML = `<div class="notebook-bar">
      <button class="primary" id="notebook-save">Save</button>
      <span class="muted" id="notebook-state">${book.saved ? "saved with the run" : "not saved"}</span>
      <button id="notebook-nrepl" title="A babashka nREPL server with these names, for your editor">nREPL</button>
      <button id="notebook-revert" title="${book.undo ? "The cells as they were before the revert" : "The cells back to the template (undone by a second click)"}">${book.undo ? "Undo the revert" : "Revert to the template"}</button>
      <button id="notebook-present" class="${book.presenting ? "on" : ""}" title="The outputs alone, for a report">Presentation</button>

    <div class="cell" id="nrepl-help" hidden style="padding:10px 14px;font-size:13px"></div>

    else { book.undo = book.cells; book.cells = notebookTemplate.split(cellSeparator); }
    book.saved = false;
    notebookDraw();
    notebookEvaluate();
  });
  $("#notebook-present").addEventListener("click", (event) => {
    book.presenting = !book.presenting;
    event.target.classList.toggle("on", book.presenting);
    $("#notebook").classList.toggle("presenting", book.presenting);
  });
  $("#notebook-nrepl").addEventListener("click", async () => {
    try {
      const { port } = await apiJson(`/runs/${book.runId}/nrepl`, {});
      $("#nrepl-help").hidden = false;
      $("#nrepl-help").innerHTML = `<b>nREPL for run ${book.runId}</b> on the server's 127.0.0.1:${port} (babashka; the notebook's names are in
        <span class="mono">user</span>, and actions such as <span class="mono">(replay {...})</span> run at once and return their output).<br>
        Tunnel it, then connect your editor (CIDER, Calva, Conjure, Cursive) to localhost:${port}:

clj -Sdeps '{:deps {nrepl/nrepl {:mvn/version "1.8.0"}}}' -M -m nrepl.cmdline --connect --host 127.0.0.1 --port ${port}</pre>`;
    } catch (error) { $("#nrepl-help").hidden = false; $("#nrepl-help").textContent = error.message; }

async function notebookSave() {
  const book = state.notebook;
  const response = await fetch(`/runs/${book.runId}/notebook`, {
    method: "PUT", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ source: book.cells.join(cellSeparator) }),
  });
  book.saved = response.ok;
  $("#notebook-state").textContent = response.ok ? "saved with the run" : await response.text();
