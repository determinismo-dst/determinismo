// Evaluates every cell on the server; an edit meanwhile starts a new generation.
async function notebookEvaluate() {
  const book = state.notebook;
  const generation = ++book.generation;
  const outputs = [...document.querySelectorAll("#notebook .cell[data-index] .out")];
  outputs.forEach((out) => { out.innerHTML = `<span class="muted">…</span>`; });
  let answer;
  try {
    answer = await apiJson(`/runs/${book.runId}/notebook/evaluate`,
      { cells: book.cells, results: Object.fromEntries(book.results) });
  } catch (error) {
    if (generation === book.generation) outputs.forEach((out, i) => { out.innerHTML = i ? "" : `<div class="error">${escape(error.message)}</div>`; });
    return;
  }
  if (generation !== book.generation) return;
  answer.cells.forEach((cell, index) => {
    const out = outputs[index];
    if (!out) return;
    cell.outputs.forEach((output, i) => { output.__index = i; });
    out.innerHTML = cell.outputs.map((output) => outputHtml(output, index)).join("");
    out.querySelectorAll(".action button").forEach((button) => button.addEventListener("click", () =>
      actionRun(book, cell.outputs[Number(button.dataset.output)], button)));
  });
}

function outputHtml(output, cellIndex) {
  switch (output.type) {
    case "md": return `<div class="md">${markdown(output.text)}</div>`;
    case "text": return `<pre>${escape(output.text)}</pre>`;
    case "edn": return `<pre class="edn">${escape(output.text)}</pre>`;
    case "error": return `<div class="error">${escape(output.text)}</div>`;
    case "events": return valueHtml(output.events) + (output.count > output.events.length ? `<div class="muted">first ${output.events.length} of ${output.count}</div>` : "");
    case "action": {
      const done = output.result != null;
      return `<div class="action"><button data-output="${output.__index}">${done ? "Run again" : "Run"}</button>
        <span class="mono">${escape(output.label)}</span></div>${done ? valueHtml(actionShown(output.result)) : ""}`;
    }
    default: return `<pre>${escape(JSON.stringify(output))}</pre>`;
  }
}

// What an action result looks like: a replay's output as text, a file as its link.
const downloads = new Map();
function actionShown(result) {
  if (result && result.bytes !== undefined) return { ...result, url: downloads.get(result.name) };
  return result;
}

async function actionRun(book, output, button) {
  button.disabled = true;
  button.textContent = "Running…";
  const { path, body } = output.request;
  try {
    if (path === "extract") {
      const response = await fetch(`/runs/${book.runId}/extract`, {
        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
      });
      if (!response.ok) throw new Error(await response.text());
      const blob = await response.blob();
      const name = body.path.split("/").pop() || "file";
      downloads.set(name, URL.createObjectURL(blob));
      book.results.set(output.label, { bytes: blob.size, name });
    } else {
      const text = await api(`/runs/${book.runId}/${path}`, body);
      // A branch's steps come back whole: the notebook makes its moments and processes of them.
      book.results.set(output.label, body.steps ? text : momentOutput(text));
    }
  } catch (error) { book.results.set(output.label, `error: ${error.message}`); }
  notebookEvaluate();
}

// A value as the notebook shows it: events as a log table, files as links, text as is.
function valueHtml(value) {
  if (value instanceof Error) return `<div class="error">${escape(value.message)}</div>`;
  if (typeof value === "string") return `<pre>${escape(value)}</pre>`;
  if (Array.isArray(value) && value.length && value.every((item) => item && item.event !== undefined && item.vtime_ns !== undefined)) {
    return `<div class="logs" style="max-height:300px"><table>${value.map((item) => {
      const { kind, text, css } = describe(item.event);
      return `<tr><td class="muted">${item.branch !== undefined ? "#" + item.branch : ""}</td><td class="muted">${seconds(item.vtime_ns)}</td>
        <td><span class="kind ${css}">${escape(kind)}</span></td><td>${escape(text)}</td></tr>`;
    }).join("")}</table></div><div class="muted">${value.length} events</div>`;
  }
  if (value && value.url && value.bytes !== undefined) {
    return `<a href="${value.url}" download="${escape(value.name)}">${escape(value.name)}</a> <span class="muted">${value.bytes} bytes</span>`;
  }
  return `<pre>${escape(JSON.stringify(value, null, 2))}</pre>`;
}

// Markdown enough for notes: headings, lists, code, bold, italics, paragraphs.
function markdown(text) {
  const inline = (line) => escape(line).replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/\*([^*]+)\*/g, "<i>$1</i>");
  return text.split("\n").map((line) => {
    const heading = /^(#{1,3}) (.*)$/.exec(line);
    if (heading) return `<h${heading[1].length}>${inline(heading[2])}</h${heading[1].length}>`;
    if (/^[-*] /.test(line)) return `<li>${inline(line.slice(2))}</li>`;
    return line.trim() ? `<p style="margin:4px 0">${inline(line)}</p>` : "";
  }).join("");
}

// From a replay's output: what the command printed, then determinismo's own lines.
// A moment replay's output: what its command printed, and the replay's own lines.
function momentParts(text) {
  const printed = [], other = [];
  let ran = false; // The command ran (its exec_done): else the replay never got to it.
  // The run's own background commands (a CI shard's tests, still running at the moment): their
  // output is the timeline's, not the moment command's.
  const background = new Set();
  for (const line of text.split("\n")) {
    const at = line.indexOf('{"event":"exec_start"');
    if (at < 0) continue;
    try { const details = JSON.parse(line.slice(at)).details; if (details.background) background.add(details.id); } catch { /* skip */ }
  }
  for (const line of text.split("\n")) {
    const at = line.indexOf('{"event":"exec_output"');
    if (at >= 0) {
      try { const details = JSON.parse(line.slice(at)).details; if (!background.has(details.id)) printed.push(details.text); } catch { /* skip */ }
    }
    else if (line.startsWith("[determinismo]") || line.startsWith("[branch") || line.startsWith("error:")) other.push(line);
    if (line.includes('{"event":"exec_done"')) ran = true;
  }
  // A replay refused or failed before the command (its error, its usage): said as it is, never
  // "(no output)" (a CI timeline's replay to a moment was refused so, 2026-11-11).
  if (!ran && !printed.length) {
    const tail = text.trim().split("\n").slice(-30).join("\n");
    return { printed: "The command did not run; the replay said:", other: tail || "(nothing)" };
  }
  return { printed: printed.join("") || "(no output)", other: other.join("\n") };
}
function momentOutput(text) {
  const { printed, other } = momentParts(text);
  return printed + "\n\n" + other;
}

// One line for an event, whatever its kind.
function describe(event) {
  if (!event || typeof event !== "object") return { kind: "text", text: String(event), css: "" };
  if (event.output) return { kind: `${event.output.source} ${event.output.stream}`, text: event.output.text, css: "output" };
  if (event.assert) {
    const failed = event.assert.condition === false && ["always", "always_or_unreachable"].includes(event.assert.type)
      || event.assert.type === "unreachable";
    return { kind: event.assert.type, text: `${event.assert.message}${event.assert.condition === false ? " (false)" : ""} ${JSON.stringify(event.assert.details || {})}`, css: failed ? "assert-fail" : "assert" };
  }
  if (event.antithesis_assert) {
    const a = event.antithesis_assert;
    return { kind: a.display_type || "assert", text: `${a.message}${a.condition === false ? " (false)" : ""}`, css: a.condition === false ? "assert-fail" : "assert" };
  }
  // A fault and a strategy's decision read as what they did and why, their details after.
  if (event.event === "fault") {
    const d = event.details || {};
    const why = d.injected ? " · asked for by the scenario" : d.why === "aimed" ? " · aimed at the node the scenario names"
      : d.why === "branch_point" ? " · after a branch point at its node"
      : d.why === "aftershock" ? " · an aftershock" : d.why === "crash_point" ? " · at a crash point of the node's code" : "";
    return { kind: "fault", text: `${faultName({ event })}${d.duration_ns ? " for " + ms(d.duration_ns) : ""}${why}   ${JSON.stringify(d)}`, css: "fault" };
  }
  if ((event.event === "crash_stack" || event.event === "exit_stack") && event.details) {
    const d = event.details;
    return { kind: event.event === "crash_stack" ? "crash stack" : "exit stack", css: event.event === "crash_stack" ? "assert-fail" : "",
      text: `${stackHeadline(event.event, d)}: ${stackFrames(d).slice(0, 4).join(" ← ")}`, html: stackHtml(event.event, d) };
  }
  if (event.event === "decision" && event.details && event.details.reason) {
    return { kind: "decision", text: `${event.details.reason}   ${JSON.stringify(event.details)}`, css: "" };
  }
  if (event.event) {
    const css = event.event.startsWith("command") ? "command" : "";
    return { kind: event.event, text: JSON.stringify(event.details || {}), css };
  }
  if (event.lifecycle) return { kind: "lifecycle", text: event.lifecycle, css: "" };
  return { kind: "event", text: JSON.stringify(event), css: "" };
}

// A crash's or an exit's stack (crash_stack, exit_stack: guest/runtime/where.zig): the process,
// what ended it, then its frames by name (the instruction it stopped at, its callers by frame
// pointers, then the code addresses found above it on its stack).
const signalNames = { 4: "SIGILL", 5: "SIGTRAP", 6: "SIGABRT", 7: "SIGBUS", 8: "SIGFPE", 9: "SIGKILL", 11: "SIGSEGV", 15: "SIGTERM" };
function stackFrames(d) { return [...(d.frames || []), ...(d.scanned || [])].map((frame) => frame.at || frame.address); }
function stackHeadline(name, d) {
  const ended = name === "crash_stack" ? `${signalNames[d.signal] || "signal " + d.signal}${d.fault_address ? " at " + d.fault_address : ""}` : `exit ${d.status}`;
  return `${d.process || "?"} (pid ${d.pid}) in ${d.node || "?"}: ${ended}${d.error ? ` · its stack unread: ${d.error}` : ""}`;
}
function stackHtml(name, d) {
  const frames = d.frames || [], scanned = d.scanned || [];
  const item = (frame) => `<li title="${escape(frame.address || "")}">${escape(frame.at || frame.address || "?")}</li>`;
  // No whitespace between the parts: a log's cell keeps it (pre-wrap).
  return `<div class="stack"><div>${escape(stackHeadline(name, d))}</div>`
    + `<ol class="mono">${frames.map(item).join("")}</ol>`
    + (scanned.length ? `<div class="muted" style="font-size:11.5px">Above it on its stack: code addresses, its callers among them</div>`
      + `<ol class="mono" start="${frames.length + 1}">${scanned.map(item).join("")}</ol>` : "")
    + `</div>`;
}

// CI jobs ---------------------------------------------------------------------------------
// determinismo-ci's jobs (runs whose request names a `ci` job: repository, branch, commit,
// subject), each repository's newest first, and the history a run's page cannot give: each test
// that did not pass everywhere, its verdict in each of the last jobs (failing since which
// commit, flaky in which, fixed when), each cell its property's page in that job's run.
const ciJobsShown = 10;
async function ciOpen() {
  state.indexOpen = false;
  state.runId = null;
  clearTimeout(state.poll);
  if (location.hash !== "#ci") history.pushState(null, "", "#ci");
  const main = $("#main");
  main.dataset.view = "ci";
  delete main.dataset.drawn;
  main.innerHTML = `<h2>CI jobs</h2><div class="muted">Loading…</div>`;
  try { state.runs = await apiJson("/runs"); } catch { /* The last list known, if any. */ }
  const jobs = (state.runs || []).filter((run) => run.ci).sort((a, b) => b.id - a.id);
  if (location.hash !== "#ci") return;
  if (!jobs.length) {
    main.innerHTML = `<h2>CI jobs</h2><div class="muted">None yet: determinismo-ci's jobs show here (docs/CI.md).</div>`;
    return;
  }
  const repositories = new Map();
  for (const job of jobs) {
    const key = job.ci.repository || "(no repository)";
    if (!repositories.has(key)) repositories.set(key, []);
    repositories.get(key).push(job);
  }
  // Each recent job's tests (its properties named "test passes: ..."), all asked at once.
  const recent = [...repositories.values()].flatMap((list) => list.slice(0, ciJobsShown));
  const tests = new Map(); // run id -> Map(test -> {failing, hit})
  await Promise.all(recent.map(async (job) => {
    const properties = await apiJson(`/runs/${job.id}/properties`).catch(() => []);
    const byTest = new Map();
    for (const p of properties) {
      if (!p.message.startsWith("test passes: ")) continue;
      byTest.set(p.message.slice("test passes: ".length), { failing: p.timelines_failing, hit: p.timelines_hit });
    }
    tests.set(job.id, byTest);
  }));
  if (location.hash !== "#ci") return;
  const short = (commit) => escape((commit || "").slice(0, 10));
  const sections = [...repositories.entries()].map(([repository, list]) => {
    const shown = list.slice(0, ciJobsShown);
    const verdictOf = (job) => {
      const byTest = tests.get(job.id) || new Map();
      let failing = 0, flaky = 0;
      for (const v of byTest.values()) { if (v.failing === 0) continue; if (v.failing >= v.hit) failing++; else flaky++; }
      return { count: byTest.size, failing, flaky };
    };
    const rows = shown.map((job) => {
      const v = verdictOf(job);
      return `<tr class="clickable" data-id="${job.id}"><td class="mono">${job.id}</td><td>${stateBadge(job.state)}</td>
        <td class="mono">${escape(job.ci.branch || "")}</td><td class="mono">${short(job.ci.commit)}</td>
        <td>${escape(job.ci.subject || "")}</td>
        <td>${v.count ? `${v.count.toLocaleString()} tests${v.failing ? `, <span class="fail-text">${v.failing} failing</span>` : ""}${v.flaky ? `, ${v.flaky} flaky` : ""}` : ""}</td></tr>`;
    }).join("");
    // The tests that did not pass in every job shown, newest job first.
    const unsteady = new Set();
    for (const job of shown) for (const [name, v] of (tests.get(job.id) || new Map())) if (v.failing > 0) unsteady.add(name);
    const cell = (job, name) => {
      const v = (tests.get(job.id) || new Map()).get(name);
      if (!v) return `<td class="muted">—</td>`;
      const href = `#${job.id}/property/${encodeURIComponent("test passes: " + name)}`;
      if (v.failing === 0) return `<td><a href="${href}" class="pass-text">pass</a></td>`;
      if (v.failing >= v.hit) return `<td><a href="${href}" class="fail-text">fail</a></td>`;
      return `<td><a href="${href}">flaky ${v.failing}/${v.hit}</a></td>`;
    };
    const grid = unsteady.size ? `<h3 class="index-section">Tests not passing everywhere, over ${shown.length === 1 ? "its job" : `the last ${shown.length} jobs`}</h3>
      <table class="runs-index"><tr><th>Test</th>${shown.map((job) => `<th class="mono" title="${escape(job.ci.subject || "")}">${short(job.ci.commit)}</th>`).join("")}</tr>
      ${[...unsteady].sort().map((name) => `<tr><td class="mono">${escape(name)}</td>${shown.map((job) => cell(job, name)).join("")}</tr>`).join("")}</table>`
      : `<div class="muted">Every test passed in every job shown.</div>`;
    return `<h3 class="index-section">${escape(repository)}</h3>
      <table class="runs-index"><tr><th>Run</th><th>State</th><th>Branch</th><th>Commit</th><th>Subject</th><th>Tests</th></tr>${rows}</table>${grid}`;
  }).join("");
  main.innerHTML = `<h2>CI jobs</h2><div class="muted index-meta">${jobs.length} jobs, ${repositories.size} ${repositories.size === 1 ? "repository" : "repositories"}</div>${sections}`;
  main.querySelectorAll("tr.clickable").forEach((row) => row.addEventListener("click", () => runOpen(Number(row.dataset.id))));
}

// New runs --------------------------------------------------------------------------------
$("#new-run").addEventListener("click", () => $("#run-dialog").showModal());
// An uploaded strategy is kept by the server; runs name it as @name.
$("#strategy-file").addEventListener("change", async (event) => {
  const file = event.target.files[0];
  if (!file) return;
  const name = file.name.replace(/[^A-Za-z0-9._-]/g, "_").replace(/^\.+/, "");
  $("#strategy-status").textContent = `Uploading ${name}…`;
  const response = await fetch(`/strategies/${encodeURIComponent(name)}`, { method: "PUT", body: file });
  if (!response.ok) { $("#strategy-status").textContent = await response.text(); return; }
  const { strategy } = await response.json();
  $("#run-form").elements.strategy.value = strategy;
  $("#strategy-status").textContent = `Uploaded: this run uses ${strategy} (add arguments after it).`;
});
$("#run-form").addEventListener("submit", async (event) => {
  if (event.submitter && event.submitter.value === "cancel") return;
  const form = new FormData($("#run-form"));
  const request = { [form.get("kind")]: form.get("path") };
  if (form.get("seed")) request.seed = Number(form.get("seed")); // Else a fresh one.
  if (form.get("repeat")) request.repeat = true;
  if (form.get("branches")) request.branches = Number(form.get("branches"));
  for (const key of ["scenario", "profile", "strategy", "time_budget", "timeline", "changed", "changed_repository"]) if (form.get(key)) request[key] = form.get(key);
  request.branching = request.strategy ? "flat" : form.get("branching");
  if (form.get("jobs")) request.jobs = Number(form.get("jobs"));
  for (const key of ["memory_mib", "verify_replays"]) if (form.get(key)) request[key] = Number(form.get(key));
  if (form.get("priority")) request.priority = true;
  if (form.get("what_if")) request.findings_history = false;
  if (form.get("setup_only")) request.setup_only = true;
  const automations = String(form.get("automations") || "").split("\n").map((line) => line.trim()).filter(Boolean);
  if (automations.length) request.automations = automations.map((exec) => ({ exec }));
  try {
    const created = await apiJson("/runs", request);
    await runsRefresh();
    runOpen(created.id);
  } catch (error) { alert(error.message); }
});

runsRefresh();
setInterval(runsRefresh, 5000);
const fromHash = routeOf(location.hash);
// A property's link (the ⧉ on its row, Antithesis's link to a finding): the run's page opened
// at it, its examples shown; the query string dropped once used.
// Links made before properties had pages (?property=<message>#<id>): the page.
const linkedProperty = new URLSearchParams(location.search).get("property");
if (linkedProperty) queryParamSet("property", "");
if (location.hash === "#ci") ciOpen();
else if (fromHash.id && linkedProperty) runOpen(fromHash.id, "property", linkedProperty);
else if (fromHash.id) runOpen(fromHash.id, fromHash.view, fromHash.property, fromHash.timeline);
else runsIndexOpen();
window.addEventListener("hashchange", () => {
  if (location.hash === "#ci") return ciOpen();
  if (location.hash === "#runs" || location.hash === "") return runsIndexOpen();
  const route = routeOf(location.hash);
  if (route.id && (route.id !== state.runId || state.indexOpen)) return runOpen(route.id, route.view, route.property, route.timeline);
  if (route.timeline !== null && route.id === state.runId) return timelineOpen(route.timeline);
  if (!route.id || (route.view === state.view && route.property === state.property)) return;
  const from = state.property;
  if (from) state.examplesOpen.clear(); // The list refreshes again (its examples stay loaded).
  state.view = route.view;
  state.property = route.property;
  render();
  window.scrollTo(0, 0);
  // Back from a property's page: the list where that property is.
  const row = from && route.view === "report" ? [...document.querySelectorAll("#properties .property")].find((p) => p.dataset.message === from) : null;
  if (row) row.scrollIntoView({ block: "center" });
});
</script>
